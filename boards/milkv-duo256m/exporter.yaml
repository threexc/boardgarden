tg-duo256m:
  location: ecoforge
  serial:
    cls: 'USBSerialPort'
    match:
      ID_SERIAL_SHORT: 'DU0ET82D'
      ID_USB_INTERFACE_NUM: '00'
  power-gpio:
    cls: 'MatchedSysfsGPIO'
    match:
      '@SUBSYSTEM': usb
      '@ID_SERIAL_SHORT': 'DU0ET82D'
    pin: 0
  tftp:
    cls: 'RemoteTFTPProvider'
    host: '192.168.40.166'
    internal: '/srv/tftp/milkv-duo256m/'
    external: 'milkv-duo256m/'
  sdmux:
    cls: 'USBSDMuxDevice'
    match:
      ID_SERIAL_SHORT: '000000001473'
