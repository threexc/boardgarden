targets:
  main:
    resources:
      RemotePlace:
        name: tg-beaglev-fire
    drivers:
      - SerialDriver:
          name: 'beaglev-fire-console-1'
          bindings:
            port: 'serial'
      - GpioDigitalOutputDriver:
          name: 'beaglev-fire-power-gpio-1'
          bindings:
            gpio: 'power-gpio'
      - DigitalOutputPowerDriver:
          name: 'beaglev-fire-power-1'
          bindings:
            output: 'beaglev-fire-power-gpio-1'
      - TFTPProviderDriver:
          name: 'beaglev-fire-tftp-1'
          bindings:
            provider: 'tftp'
      - UBootDriver:
          prompt: 'RISC-V # '
          autoboot: 'Hit any key to stop autoboot'
          interrupt: 's'
          name: 'beaglev-fire-uboot-1'
          boot_commands:
            emmc: 'boot'
            tftp: 'booti $kernel_addr_r $ramdisk_addr_r:$filesize $fdt_addr_r'
          bindings:
            console: 'beaglev-fire-console-1'
          login_timeout: 30
          boot_timeout: 30
          strip_timestamp: True
      - ShellDriver:
          prompt: '~ #\s*'
          login_prompt: '[-\w]+ login: '
          username: 'root'
          name: 'beaglev-fire-shell-1'
          bindings:
            console: 'beaglev-fire-console-1'
      - BeagleVFireBootStrategy:
          name: 'beaglev-fire-strategy-1'
          bindings:
            power: 'beaglev-fire-power-1'
            console: 'beaglev-fire-console-1'
            uboot: 'beaglev-fire-uboot-1'
            shell: 'beaglev-fire-shell-1'
            tftp: 'beaglev-fire-tftp-1'

imports:
  - strategy.py
