name: beaglev-fire
yocto_machine: beaglev-fire
exclude_from_nightly: false
strategy: tftp
description: BeagleV-Fire (Microchip PolarFire SoC) RISC-V SBC. Yocto initramfs root
remote_place: tg-beaglev-fire
image_source: yocto
arch: riscv64

boot:
  method: tftp
  # loglevel=6: eMMC probe messages (KERN_INFO) land on the console as the
  # initramfs shell starts and drop the input labgrid sends; the "Linux
  # version" banner await_boot waits for is KERN_NOTICE, so it still shows
  # (the console prints only levels below loglevel).
  bootargs: console=ttyS0,115200 loglevel=6 shell
  # The board's U-Boot may define no *_addr_r variables (the vendor
  # 2022.01-linux4microchip one doesn't), so boot a FIT image: its kernel load
  # address comes from the build. Stage it clear of the kernel at 0x80200000.
  kernel_addr: '0x90000000'

tftp:
  subdir: beaglev-fire
  kernel: fitImage

uboot:
  prompt: 'RISC-V # '
  autoboot: 'Hit any key to stop autoboot'
  interrupt: s
  emmc_cmd: boot
  tftp_cmd: bootm 0x90000000

shell:
  username: root
  password: null
  # initramfs-module-debug drops straight to a busybox shell, no login prompt.
  prompt: '~ #\s*'
  login_prompt: '[-\w]+ login: '

strategy_class: BeagleVFireBootStrategy
