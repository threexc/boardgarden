tg-beaglev-fire:
  location: ecoforge
  serial:
    cls: 'USBSerialPort'
    match:
      ID_SERIAL_SHORT: 'D30HE1U0'
      ID_USB_INTERFACE_NUM: '00'
  power-gpio:
    cls: 'MatchedSysfsGPIO'
    match:
      '@SUBSYSTEM': usb
      '@ID_SERIAL_SHORT': 'D30HE1U0'
    pin: 0
  tftp:
    cls: 'RemoteTFTPProvider'
    host: '192.168.40.166'
    internal: '/srv/tftp/beaglev-fire/'
    external: 'beaglev-fire/'
