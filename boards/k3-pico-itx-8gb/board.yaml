name: k3-pico-itx-8gb
yocto_machine: k3-pico-itx
strategy: fastboot
description: K3 Pico-ITX (SpacemiT K3) RISC-V SBC. Flashed over USB fastboot
remote_place: tg-k3-pitx-8gb
image_source: yocto
inherits:
  - ../families/spacemit-k1/defaults.yaml

# Relay-driven buttons: PWR power, FDL flashing (download mode), RST reset
buttons: [pwr, fdl, rst]

# Vendor user guide, 3.1.2 "Device Powered by a Full-Featured Type-C Cable or
# ATX Power Supply (Powered On)": hold FDL, press RST, release FDL. The boot
# ROM then takes FSBL, which takes a fastboot-capable U-Boot, all in RAM.
# Flashing follows meta-riscv's docs/k3-pico-itx.md, in order: the boot
# firmware to SPI-NOR (where the boot ROM loads it from), then the GPT,
# bootfs and rootfs to the first block device U-Boot finds (NVMe, then UFS).
# A bad firmware write is recoverable: download mode is in the boot ROM.
fastboot:
  image_dir: /home/labgrid/k3-pico-itx-fastboot
  recovery_button: fdl
  reset_button: rst
  stage:
    - FSBL.bin
    - u-boot.itb
  flash:
    mtd: partition_nor.json
    bootinfo: bootinfo_spinor.bin
    fsbl: FSBL.bin
    env: u-boot-env-default.bin
    esos: esos.itb
    opensbi: fw_dynamic.itb
    uboot: u-boot.itb
    gpt: partition_yocto.json
    bootfs: bootfs.ext4
    rootfs: rootfs.ext4

shell:
  username: root
  password: null

# For the TFTP variants. The fastboot flash writes U-Boot's default env, so
# bootdelay is 0: "Autoboot in 0 seconds" leaves no time to answer it. Send
# the stop key ("s", AUTOBOOT_KEYED) once the console is up after relocation
# instead: it waits in the UART FIFO for autoboot's single key check. Earlier
# is too early, as the post-relocation serial probe resets the FIFO.
uboot:
  autoboot: 'Err:\s+serial'

strategy_class: K3PicoItxBootStrategy

# Other ways to boot this board, each for its own Yocto MACHINE. Each renders
# to client-<name>.yaml and gets a row in boards/machines.tsv.
variants:
  # Same MACHINE as the default, but TFTP-booted like k3-pico-itx-32gb: kernel,
  # DTB and initramfs from the vendor U-Boot on SPI-NOR, storage untouched.
  # Select it with run-board-tests' boot_method: tftp.
  tftp:
    strategy: tftp
    strategy_class: K3PicoItxTftpBootStrategy
    exclude_from_nightly: true
    boot:
      method: tftp
      bootargs: console=ttyS0,115200 shell
      dtb_addr: $fdt_addr_r
      ramdisk_addr: $ramdisk_addr_r
    tftp:
      subdir: k3-pico-itx
      dtb: k3-pico-itx.dtb
      initramfs: uRamdisk
    uboot:
      tftp_cmd: booti $kernel_addr_r $ramdisk_addr_r:$filesize $fdt_addr_r
    shell:
      prompt: '~ #\s*'
  # meta-riscv BSP with linux-mainline: the vendor boot firmware with a
  # mainline kernel, flashed over fastboot like the default. Select it with
  # run-board-tests' boot_method: fastboot (mainline-fit is the default for
  # this MACHINE). Its own TFTP subdir and image_dir keep its flash images
  # apart from the default's.
  mainline:
    yocto_machine: k3-pico-itx-mainline
    strategy_class: K3PicoItxMainlineBootStrategy
    tftp:
      subdir: k3-pico-itx-mainline
    fastboot:
      image_dir: /home/labgrid/k3-pico-itx-mainline-fastboot
  # Same MACHINE as mainline, but TFTP-booted from the vendor U-Boot on
  # SPI-NOR as one FIT image (kernel, DTB and initramfs), storage untouched.
  # bootm copies the kernel to the FIT's load address, so the machine must set
  # UBOOT_ENTRYPOINT (and FIT_ADDRESS_CELLS = "2": K3 DRAM is above 4 GiB) to
  # where booti would put it: U-Boot's ram_base + the Image's 2 MiB
  # text_offset. The default for k3-pico-itx-mainline; select the fastboot
  # flash with run-board-tests' boot_method: fastboot. This leaves SPI-NOR
  # holding whatever boot firmware the last fastboot flash wrote.
  mainline-fit:
    yocto_machine: k3-pico-itx-mainline
    default: true
    strategy: tftp
    strategy_class: K3PicoItxMainlineFitBootStrategy
    boot:
      method: tftp
      bootargs: console=ttyS0,115200 shell
    tftp:
      subdir: k3-pico-itx-mainline
      kernel: fitImage
    uboot:
      tftp_cmd: bootm $kernel_addr_r
    shell:
      prompt: '~ #\s*'
