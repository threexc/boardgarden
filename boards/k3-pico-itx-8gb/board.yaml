name: k3-pico-itx-8gb
yocto_machine: k3-pico-itx
strategy: fastboot
description: K3 Pico-ITX (SpacemiT K3) RISC-V SBC. Flashed over USB fastboot
remote_place: bf-k3-pico-itx-8gb
image_source: yocto
inherits:
  - ../families/spacemit-k1/defaults.yaml

# Relay-driven buttons: PWR power, FDL flashing (download mode), RST reset
buttons: [pwr, fdl, rst]

# Vendor user guide, 3.1.2 "Device Powered by a Full-Featured Type-C Cable or
# ATX Power Supply (Powered On)": hold FDL, press RST, release FDL. The boot
# ROM then takes FSBL, which takes a fastboot-capable U-Boot. Firmware stays
# on SPI-NOR; U-Boot flashes these GPT partitions to the first block device
# it finds (NVMe, then UFS) and later boots them by name.
fastboot:
  image_dir: /home/labgrid/k3-pico-itx-fastboot
  recovery_button: fdl
  reset_button: rst
  stage:
    - FSBL.bin
    - u-boot.itb
  flash:
    gpt: partition_universal.json
    bootfs: bootfs.ext4
    rootfs: rootfs.ext4

shell:
  username: root
  password: null

strategy_class: K3PicoItxBootStrategy

# Other ways to boot this board, each for its own Yocto MACHINE. Each renders
# to client-<name>.yaml and gets a row in boards/machines.tsv.
variants:
  # meta-riscv BSP with linux-mainline: TFTP-boots kernel, DTB and initramfs
  # from the vendor U-Boot on SPI-NOR, leaving the flashed storage untouched.
  mainline:
    yocto_machine: k3-pico-itx-mainline
    strategy: tftp
    strategy_class: K3PicoItxMainlineBootStrategy
    # Manual dispatch only for now; drop this to add it to the nightly matrix.
    exclude_from_nightly: true
    boot:
      method: tftp
      bootargs: console=ttyS0,115200 shell
      dtb_addr: $fdt_addr_r
      ramdisk_addr: $ramdisk_addr_r
    tftp:
      subdir: k3-pico-itx-mainline
      dtb: k3-pico-itx.dtb
      initramfs: uRamdisk
    uboot:
      tftp_cmd: booti $kernel_addr_r $ramdisk_addr_r:$filesize $fdt_addr_r
    shell:
      # initramfs-module-debug drops straight to a busybox shell, no login prompt.
      prompt: '~ #\s*'
