targets:
  main:
    resources:
      RemotePlace:
        name: tg-k3-pitx-8gb
    drivers:
      - SerialDriver:
          name: 'k3-pico-itx-8gb-console-1'
          bindings:
            port: 'serial'
      - GpioDigitalOutputDriver:
          name: 'k3-pico-itx-8gb-power-gpio-1'
          bindings:
            gpio: 'power-gpio'
      - DigitalOutputPowerDriver:
          name: 'k3-pico-itx-8gb-power-1'
          bindings:
            output: 'k3-pico-itx-8gb-power-gpio-1'
      - GpioDigitalOutputDriver:
          name: 'k3-pico-itx-8gb-pwr-gpio-1'
          bindings:
            gpio: 'pwr-gpio'
      - GpioDigitalOutputDriver:
          name: 'k3-pico-itx-8gb-fdl-gpio-1'
          bindings:
            gpio: 'fdl-gpio'
      - GpioDigitalOutputDriver:
          name: 'k3-pico-itx-8gb-rst-gpio-1'
          bindings:
            gpio: 'rst-gpio'
      - AndroidFastbootDriver:
          name: 'k3-pico-itx-8gb-fastboot-1'
          bindings:
            fastboot: 'fastboot'
      - TFTPProviderDriver:
          name: 'k3-pico-itx-8gb-tftp-1'
          bindings:
            provider: 'tftp'
      - UBootDriver:
          prompt: '=> '
          autoboot: 'Hit any key to stop autoboot: +[1-9]'
          interrupt: 's'
          name: 'k3-pico-itx-8gb-uboot-1'
          boot_commands:
            emmc: 'boot'
            tftp: 'bootm $kernel_addr_r'
          bindings:
            console: 'k3-pico-itx-8gb-console-1'
          login_timeout: 30
          boot_timeout: 30
          strip_timestamp: True
      - ShellDriver:
          prompt: '~ #\s*'
          login_prompt: '[-\w]+ login: '
          username: 'root'
          name: 'k3-pico-itx-8gb-shell-1'
          bindings:
            console: 'k3-pico-itx-8gb-console-1'
      - K3PicoItxMainlineYmodemBootStrategy:
          name: 'k3-pico-itx-8gb-strategy-1'
          bindings:
            power: 'k3-pico-itx-8gb-power-1'
            console: 'k3-pico-itx-8gb-console-1'
            uboot: 'k3-pico-itx-8gb-uboot-1'
            shell: 'k3-pico-itx-8gb-shell-1'
            tftp: 'k3-pico-itx-8gb-tftp-1'
            fastboot: 'k3-pico-itx-8gb-fastboot-1'
            recovery: 'k3-pico-itx-8gb-fdl-gpio-1'
            reset: 'k3-pico-itx-8gb-rst-gpio-1'

imports:
  - strategy.py
