tg-k3-pitx-8gb:
  location: ecoforge
  serial:
    cls: 'USBSerialPort'
    match:
      ID_SERIAL_SHORT: 'DU0ET816'
      ID_USB_INTERFACE_NUM: '00'
  power-gpio:
    cls: 'MatchedSysfsGPIO'
    match:
      '@SUBSYSTEM': usb
      '@ID_SERIAL_SHORT': 'DU0ET816'
      'LABGRID_SYSFS_GPIOCHIP': '1'
    pin: 0
  pwr-gpio:
    cls: 'MatchedSysfsGPIO'
    match:
      '@SUBSYSTEM': usb
      '@ID_SERIAL_SHORT': 'DU0ET816'
      'LABGRID_SYSFS_GPIOCHIP': '1'
    pin: 1
  fdl-gpio:
    cls: 'MatchedSysfsGPIO'
    match:
      '@SUBSYSTEM': usb
      '@ID_SERIAL_SHORT': 'DU0ET816'
      'LABGRID_SYSFS_GPIOCHIP': '1'
    pin: 2
  rst-gpio:
    cls: 'MatchedSysfsGPIO'
    match:
      '@SUBSYSTEM': usb
      '@ID_SERIAL_SHORT': 'DU0ET816'
      'LABGRID_SYSFS_GPIOCHIP': '1'
    pin: 3
  ## SpacemiT download mode on the DRD Type-C port. The USB ID changes between
  ## stages (boot ROM is 361c:0008), so udev/90-spacemit-fastboot.rules flags
  ## every SpacemiT device for labgrid and this pins the port instead.
  ## ID_PATH, not sys_name: the device may enumerate on the USB2 or USB3 bus
  ## of the same port, which changes sys_name (1-3.2.1 vs 2-3.2.1).
  fastboot:
    cls: 'AndroidUSBFastboot'
    match:
      ID_PATH: 'pci-0000:02:00.3-usb-0:3.2.1'
  ## TFTP-booted variants (see variants: in board.yaml)
  tftp:
    cls: 'RemoteTFTPProvider'
    host: '192.168.40.166'
    internal: '/srv/tftp/k3-pico-itx-mainline/'
    external: 'k3-pico-itx-mainline/'
