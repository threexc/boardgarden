bf-k3-pico-itx-8gb:
  location: ecoforge
  k3-pico-itx-8gb-serial-port-1:
    cls: 'USBSerialPort'
    match:
      '@ID_SERIAL_SHORT': 'E6647C740371802F'
  k3-pico-itx-8gb-power-gpio-1:
    cls: 'MatchedSysfsGPIO'
    match:
      '@SUBSYSTEM': usb
      '@ID_SERIAL_SHORT': 'DU0ET816'
      'LABGRID_SYSFS_GPIOCHIP': '1'
    pin: 0
  k3-pico-itx-8gb-pwr-gpio-1:
    cls: 'MatchedSysfsGPIO'
    match:
      '@SUBSYSTEM': usb
      '@ID_SERIAL_SHORT': 'DU0ET816'
      'LABGRID_SYSFS_GPIOCHIP': '1'
    pin: 1
  k3-pico-itx-8gb-fdl-gpio-1:
    cls: 'MatchedSysfsGPIO'
    match:
      '@SUBSYSTEM': usb
      '@ID_SERIAL_SHORT': 'DU0ET816'
      'LABGRID_SYSFS_GPIOCHIP': '1'
    pin: 2
  k3-pico-itx-8gb-rst-gpio-1:
    cls: 'MatchedSysfsGPIO'
    match:
      '@SUBSYSTEM': usb
      '@ID_SERIAL_SHORT': 'DU0ET816'
      'LABGRID_SYSFS_GPIOCHIP': '1'
    pin: 3
  ## SpacemiT fastboot download mode on the DRD Type-C port. 361c:1001 is
  ## U-Boot's gadget ID; the boot ROM and FSBL must enumerate the same way.
  k3-pico-itx-8gb-fastboot-1:
    cls: 'AndroidUSBFastboot'
    usb_vendor_id: '361c'
    usb_product_id: '1001'
