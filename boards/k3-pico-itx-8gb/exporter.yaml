bf-k3-pico-itx-8gb:
  location: ecoforge
  k3-pico-itx-8gb-serial-port-1:
    cls: 'USBSerialPort'
    match:
      '@ID_SERIAL_SHORT': 'E6647C740371802F'
  k3-pico-itx-8gb-power-gpio-1:
    cls: 'MatchedSysfsGPIO'
    match:
      '@SUBSYSTEM': usb
      '@ID_SERIAL_SHORT': 'D30HF051'
    pin: 0
  k3-pico-itx-8gb-tftp-1:
    cls: 'RemoteTFTPProvider'
    host: '192.168.40.166'
    internal: '/srv/tftp/k3-pico-itx/'
    external: 'k3-pico-itx/'
