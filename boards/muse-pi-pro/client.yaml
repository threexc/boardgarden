targets:
  main:
    resources:
      RemotePlace:
        name: tg-muse-pi-pro
    drivers:
      - SerialDriver:
          name: 'muse-pi-pro-console-1'
          bindings:
            port: 'serial'
      - GpioDigitalOutputDriver:
          name: 'muse-pi-pro-power-gpio-1'
          bindings:
            gpio: 'power-gpio'
      - DigitalOutputPowerDriver:
          name: 'muse-pi-pro-power-1'
          bindings:
            output: 'muse-pi-pro-power-gpio-1'
      - USBStorageDriver:
          image: 'sdimage'
          bindings:
            storage: 'sdmux'
      - USBSDMuxDriver:
          bindings:
            mux: 'sdmux'
      - ShellDriver:
          prompt: '(\x1b\[\?2004h|\x1b\\)?root@[\w-]+:[^ ]+[#$] '
          login_prompt: 'login: '
          login_timeout: 120
          username: 'root'
          name: 'muse-pi-pro-shell-1'
          bindings:
            console: 'muse-pi-pro-console-1'
      - MusePiProBootStrategy:
          name: 'muse-pi-pro-strategy-1'
          bindings:
            power: 'muse-pi-pro-power-1'
            console: 'muse-pi-pro-console-1'
            shell: 'muse-pi-pro-shell-1'

images:
  sdimage: "/home/labgrid/muse-pi-pro.rootfs-latest.wic.gz"
tools:
  usbsdmux: '/home/labgrid/.local/bin/usbsdmux'

imports:
  - strategy.py
