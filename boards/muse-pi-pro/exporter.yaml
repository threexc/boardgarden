tg-muse-pi-pro:
  location: ecoforge
  serial:
    cls: 'USBSerialPort'
    match:
      ID_SERIAL_SHORT: 'D30HF056'
      ID_USB_INTERFACE_NUM: '00'
  power-gpio:
    cls: 'MatchedSysfsGPIO'
    match:
      '@SUBSYSTEM': usb
      '@ID_SERIAL_SHORT': 'D30HF056'
    pin: 0
  tftp:
    cls: 'RemoteTFTPProvider'
    host: '192.168.40.166'
    internal: '/srv/tftp/muse-pi-pro/'
    external: 'muse-pi-pro/'
  sdmux:
    cls: 'USBSDMuxDevice'
    match:
      ID_SERIAL_SHORT: '000000001034'
