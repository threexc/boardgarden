name: muse-pi-pro
yocto_machine: muse-pi-pro
strategy: sdmux
arch: riscv64
description: Muse Pi Pro (SpacemiT K1) RISC-V SBC. Boots from microSD via USB SD-Mux
remote_place: tg-muse-pi-pro
image_source: yocto
inherits:
  - ../families/spacemit-k1/defaults.yaml

boot:
  method: sdmux

image:
  label: sdimage
  path: /home/labgrid/muse-pi-pro.rootfs-latest.wic.gz

tools:
  usbsdmux: /home/labgrid/.local/bin/usbsdmux

shell:
  username: root
  password: null

strategy_class: MusePiProBootStrategy

# Other ways to boot this board. Each renders to client-<name>.yaml and gets a
# row in boards/machines.tsv.
variants:
  # Same MACHINE as the default, but TFTP-booted: kernel, DTB and initramfs
  # from U-Boot, SD card untouched. Select it with run-board-tests'
  # boot_method: tftp.
  tftp:
    strategy: tftp
    strategy_class: MusePiProTftpBootStrategy
    exclude_from_nightly: true
    boot:
      method: tftp
      bootargs: console=ttyS0,115200 shell
      # Armbian U-Boot uses $fdt_addr_r/$ramdisk_addr_r; $dtb_addr/$ramdisk_addr
      # both fall back to the same default there and overlap the kernel.
      dtb_addr: $fdt_addr_r
      ramdisk_addr: $ramdisk_addr_r
    tftp:
      subdir: muse-pi-pro
      dtb: k1-musepi-pro.dtb
      initramfs: uRamdisk
    uboot:
      autoboot: 'Hit any key to stop autoboot'
      tftp_cmd: booti $kernel_addr_r $ramdisk_addr_r:$filesize $fdt_addr_r
    shell:
      # initramfs-module-debug drops straight to a busybox shell, no login prompt.
      prompt: '~ #\s*'
