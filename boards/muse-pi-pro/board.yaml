name: muse-pi-pro
yocto_machine: muse-pi-pro
strategy: tftp
description: Muse Pi Pro (SpacemiT K1) RISC-V SBC
remote_place: bf-muse-pi-pro
image_source: bianbu
inherits:
  - ../families/spacemit-k1/defaults.yaml

boot:
  method: tftp
  bootargs: >
    console=ttyS0,115200n8
    earlyprintk
    loglevel=7
    root=/dev/mmcblk0p6
    rootfstype=ext4
    rootwait
    swiotlb=65536
    workqueue.default_affinity_scope=system

tftp:
  subdir: muse-pi-pro
  dtb: k1-musepi-pro.dtb

uboot:
  tftp_cmd: booti $kernel_addr_r - $dtb_addr

shell:
  username: root
  password: bianbu

strategy_class: MusePiProBootStrategy
