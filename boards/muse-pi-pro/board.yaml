name: muse-pi-pro
yocto_machine: muse-pi-pro
strategy: tftp
description: Muse Pi Pro (SpacemiT K1) RISC-V SBC. Yocto initramfs boot
remote_place: bf-muse-pi-pro
image_source: yocto
inherits:
  - ../families/spacemit-k1/defaults.yaml

boot:
  method: tftp
  bootargs: console=ttyS0,115200 shell
  dtb_addr: $dtb_addr
  ramdisk_addr: $ramdisk_addr

tftp:
  subdir: muse-pi-pro
  dtb: k1-musepi-pro.dtb
  initramfs: uRamdisk

uboot:
  autoboot: 'Hit any key to stop autoboot'
  tftp_cmd: booti $kernel_addr_r $ramdisk_addr:$filesize $dtb_addr

shell:
  username: root
  password: null
  # initramfs-module-debug drops straight to a busybox shell, no login prompt.
  prompt: '~ #\s*'

strategy_class: MusePiProBootStrategy
