targets:
  main:
    resources:
      RemotePlace:
        name: tg-bpi-f3
    drivers:
      - SerialDriver:
          name: 'bananapi-f3-console-1'
          bindings:
            port: 'serial'
      - GpioDigitalOutputDriver:
          name: 'bananapi-f3-power-gpio-1'
          bindings:
            gpio: 'power-gpio'
      - DigitalOutputPowerDriver:
          name: 'bananapi-f3-power-1'
          bindings:
            output: 'bananapi-f3-power-gpio-1'
      - USBStorageDriver:
          image: 'sdimage'
          bindings:
            storage: 'sdmux'
      - USBSDMuxDriver:
          bindings:
            mux: 'sdmux'
      - ShellDriver:
          prompt: '(\x1b\[\?2004h|\x1b\\)?root@[\w-]+:[^ ]+[#$] '
          login_prompt: 'login: '
          login_timeout: 120
          username: 'root'
          name: 'bananapi-f3-shell-1'
          bindings:
            console: 'bananapi-f3-console-1'
      - BananaPiF3BootStrategy:
          name: 'bananapi-f3-strategy-1'
          bindings:
            power: 'bananapi-f3-power-1'
            console: 'bananapi-f3-console-1'
            shell: 'bananapi-f3-shell-1'

images:
  sdimage: "/home/labgrid/bananapi-f3.rootfs-latest.wic.gz"
tools:
  usbsdmux: '/home/labgrid/.local/bin/usbsdmux'

imports:
  - strategy.py
