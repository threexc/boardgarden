tg-bpi-f3:
  location: ecoforge
  serial:
    cls: 'USBSerialPort'
    match:
      ID_SERIAL_SHORT: 'D30HE1U6'
      ID_USB_INTERFACE_NUM: '00'
  power-gpio:
    cls: 'MatchedSysfsGPIO'
    match:
      '@SUBSYSTEM': usb
      '@ID_SERIAL_SHORT': 'D30HE1U6'
    pin: 0
  tftp:
    cls: 'RemoteTFTPProvider'
    host: '192.168.40.166'
    internal: '/srv/tftp/bananapi-f3/'
    external: 'bananapi-f3/'
  sdmux:
    cls: 'USBSDMuxDevice'
    match:
      ID_SERIAL_SHORT: '000000001034'
