tg-k3-pitx-32gb:
  location: launch
  serial:
    cls: 'USBSerialPort'
    match:
      '@ID_PATH': 'platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.3:1.0'
  power-gpio:
    cls: 'MatchedSysfsGPIO'
    match:
      '@SUBSYSTEM': usb
      '@ID_SERIAL_SHORT': 'DU0ET81O'
      'LABGRID_SYSFS_GPIOCHIP': '1'
    pin: 0
  tftp:
    cls: 'RemoteTFTPProvider'
    host: '192.168.40.166'
    internal: '/srv/tftp/k3-pico-itx/'
    external: 'k3-pico-itx/'
