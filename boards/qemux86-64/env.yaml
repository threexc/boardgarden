imports:
  - strategy.py

targets:
  main:
    drivers:
      QEMUDriver:
        qemu_bin: qemu-system-x86_64
        kernel: qemux86-64_kernel
        cpu: 'Skylake-Client'
        memory: "8192"
        machine: 'q35'
        disk: qemux86-64_ext4
        boot_args: 'root=/dev/vda rw console=ttyS0'
        extra_args: >-
          -display none
          -device virtio-net-pci,netdev=net0,mac=52:54:00:12:35:02
          -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22,hostfwd=tcp:127.0.0.1:2323-:23
          -object rng-random,filename=/dev/urandom,id=rng0
          -device virtio-rng-pci,rng=rng0
      ShellDriver:
        prompt: 'root@[a-zA-Z0-9]+:~#\s'
        login_prompt: ' login: '
        username: 'root'
        login_timeout: 300
      QEMUX86_64YoctoStrategy: {}

images:
  qemux86-64_ext4: '/home/labgrid/ptest_image.ext4'
  qemux86-64_kernel: '/home/labgrid/bzImage'
