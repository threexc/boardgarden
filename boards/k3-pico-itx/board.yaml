name: k3-pico-itx
yocto_machine: k3-pico-itx
strategy: tftp
description: K3 Pico-ITX (SpacemiT K1) RISC-V SBC
remote_place: bf-k3-pico-itx
image_source: yocto
inherits:
  - ../families/spacemit-k1/defaults.yaml

boot:
  method: tftp
  bootargs: console=ttyS0,115200 shell
  dtb_addr: $fdt_addr_r
  ramdisk_addr: $ramdisk_addr_r

tftp:
  subdir: k3-pico-itx
  dtb: k3-pico-itx.dtb
  initramfs: uRamdisk

uboot:
  autoboot: 'Autoboot in 5 seconds'
  tftp_cmd: booti $kernel_addr_r $ramdisk_addr_r:$filesize $fdt_addr_r

shell:
  username: root
  password: null
  # initramfs-module-debug drops straight to a busybox shell, no login prompt.
  prompt: '~ #\s*'

strategy_class: K3PicoItxBootStrategy
