name: k3-pico-itx
yocto_machine: k3-pico-itx
strategy: tftp
description: K3 Pico-ITX (SpacemiT K1) RISC-V SBC
remote_place: bf-k3-pico-itx
image_source: bianbu
inherits:
  - ../families/spacemit-k1/defaults.yaml

boot:
  method: tftp
  # Copied from muse-pi-pro; adjust if K3 rootfs partition differs.
  bootargs: >
    console=ttyS0,115200n8
    earlyprintk
    loglevel=7
    root=/dev/mmcblk0p6
    rootfstype=ext4
    rootwait
    swiotlb=65536
    workqueue.default_affinity_scope=system

tftp:
  # TODO: verify subdir + dtb filename. strategy.py previously pointed at
  # "muse-pi-pro" / "k1-musepi-pro.dtb" (bug from copy-paste).
  subdir: k3-pico-itx
  dtb: k1-k3-pico-itx.dtb

uboot:
  tftp_cmd: booti $kernel_addr_r - $dtb_addr

shell:
  username: root
  password: bianbu

strategy_class: K3PicoItxBootStrategy
