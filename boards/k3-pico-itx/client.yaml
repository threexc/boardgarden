targets:
  main:
    resources:
      RemotePlace:
        name: bf-k3-pico-itx
    drivers:
      - SerialDriver:
          name: 'k3-pico-itx-console-1'
          bindings:
            port: 'k3-pico-itx-serial-port-1'
      - GpioDigitalOutputDriver:
          name: 'k3-pico-itx-power-gpio-1'
          bindings:
            gpio: 'k3-pico-itx-power-gpio-1'
      - DigitalOutputPowerDriver:
          name: 'k3-pico-itx-power-1'
          bindings:
            output: 'k3-pico-itx-power-gpio-1'
      - TFTPProviderDriver:
          name: 'k3-pico-itx-tftp-1'
          bindings:
            provider: 'k3-pico-itx-tftp-1'
      - UBootDriver:
          prompt: '=> '
          autoboot: 'Autoboot in 5 seconds'
          interrupt: 's'
          name: 'k3-pico-itx-uboot-1'
          boot_commands:
            emmc: 'boot'
            tftp: 'booti $kernel_addr_r - $dtb_addr'
          bindings:
            console: 'k3-pico-itx-console-1'
          login_timeout: 30
          boot_timeout: 30
          strip_timestamp: True
      - ShellDriver:
          prompt: '(\x1b\[\?2004h)?root@[\w-]+:[^ ]+[#$] '
          login_prompt: '[-\w]+ login: '
          username: 'root'
          password: 'bianbu'
          name: 'k3-pico-itx-shell-1'
          bindings:
            console: 'k3-pico-itx-console-1'
      - MusePiProBootStrategy:
          name: 'k3-pico-itx-strategy-1'
          bindings:
            power: 'k3-pico-itx-power-1'
            console: 'k3-pico-itx-console-1'
            uboot: 'k3-pico-itx-uboot-1'
            shell: 'k3-pico-itx-shell-1'
            tftp: 'k3-pico-itx-tftp-1'

imports:
  - strategy.py
