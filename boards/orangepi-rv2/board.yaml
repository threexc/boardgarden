name: orangepi-rv2
arch: riscv64
description: OrangePi RV2 (SpacemiT K1) RISC-V SBC. NFS root
remote_place: bf-orangepi-rv2
image_source: armbian

boot:
  method: tftp
  bootargs: >
    console=ttyS0,115200n8
    earlyprintk
    ip=dhcp
    loglevel=7
    nfsroot=$serverip:/srv/nfs3/rv2_1,nfsvers=3,tcp
    root=/dev/nfs
    rootdelay=5
    rw
    swiotlb=65536
  kernel_addr: $kernel_addr_r
  dtb_addr: $fdt_addr_r

tftp:
  subdir: orangepi-rv2
  kernel: Image
  dtb: k1-orangepi-rv2.dtb

uboot:
  emmc_cmd: boot
  tftp_cmd: booti $kernel_addr_r - $fdt_addr_r
  prompt: '=> '
  autoboot: 'Autoboot in 5 seconds'
  interrupt: s

shell:
  username: root
  password: null

strategy_class: OrangePiRV2BootStrategy
