name: orangepi-rv2
strategy: tftp
description: OrangePi RV2 (SpacemiT K1) RISC-V SBC. NFS root
remote_place: bf-orangepi-rv2
image_source: armbian
inherits:
  - ../families/spacemit-k1/defaults.yaml

boot:
  method: tftp
  bootargs: >
    console=ttyS0,115200n8
    earlyprintk
    ip=dhcp
    loglevel=7
    nfsroot=$serverip:/srv/nfs3/rv2_1,nfsvers=3,tcp
    root=/dev/nfs
    rootdelay=5
    rw
    swiotlb=65536
  # OrangePi RV2 U-Boot uses $fdt_addr_r; family default is $dtb_addr.
  dtb_addr: $fdt_addr_r

tftp:
  subdir: orangepi-rv2
  dtb: k1-orangepi-rv2.dtb

uboot:
  tftp_cmd: booti $kernel_addr_r - $fdt_addr_r

shell:
  username: root
  password: null

strategy_class: OrangePiRV2BootStrategy
