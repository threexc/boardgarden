imports:
  - strategy.py

targets:
  main:
    drivers:
      QEMUDriver:
        qemu_bin: qemu-system-aarch64
        kernel: qemuarm64_kernel
        cpu: 'cortex-a57'
        memory: "8192"
        machine: 'virt'
        disk: qemuarm64_ext4
        boot_args: 'root=/dev/vda rw console=ttyAMA0'
        extra_args: >-
          -display none
          -device virtio-net-device,netdev=net0,mac=52:54:00:12:35:02
          -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22,hostfwd=tcp:127.0.0.1:2323-:23
          -object rng-random,filename=/dev/urandom,id=rng0
          -device virtio-rng-device,rng=rng0
      ShellDriver:
        prompt: 'root@[a-zA-Z0-9]+:~#\s'
        login_prompt: ' login: '
        username: 'root'
        login_timeout: 300
      QEMUArm64YoctoStrategy: {}

images:
  qemuarm64_ext4: '/home/labgrid/ptest_image.ext4'
  qemuarm64_kernel: '/home/labgrid/Image'
