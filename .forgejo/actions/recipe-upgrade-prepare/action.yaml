name: 'Recipe upgrade: prepare'
description: >
  Check upstream for a newer tag of a recipe (see RECIPES in upgrade.py), bump
  the recipe to it, and refresh the patches each MACHINE that uses it
  applies. Writes one format-patch file per touched layer to
  out_dir/<layer>/ plus out_dir/refresh.log. Run after recipe-upgrade-setup.

inputs:
  recipe:
    description: 'Recipe to upgrade (linux-mainline, u-boot, opensbi)'
    required: true
  version:
    description: 'Target upstream version (empty for the newest tag)'
    required: false
    default: ''
  machines:
    description: 'Space-separated candidate machines (empty for all meta-riscv machines)'
    required: false
    default: ''
  out_dir:
    description: 'Where to write layer patches and refresh.log'
    required: true

outputs:
  status:
    description: '"upgraded" or "current" (no newer tag)'
    value: ${{ steps.upgrade.outputs.status }}
  old_version:
    description: 'Version before the upgrade'
    value: ${{ steps.upgrade.outputs.old_version }}
  new_version:
    description: 'Version after the upgrade'
    value: ${{ steps.upgrade.outputs.new_version }}
  machines:
    description: 'JSON array of machines that use the recipe'
    value: ${{ steps.upgrade.outputs.machines }}
  refresh_failed:
    description: '"true" if any patch could not be refreshed automatically'
    value: ${{ steps.upgrade.outputs.refresh_failed }}

runs:
  using: composite
  steps:
    - name: bump recipe and refresh patches
      id: upgrade
      shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
        VERSION: ${{ inputs.version }}
        MACHINES: ${{ inputs.machines }}
        OUT_DIR: ${{ inputs.out_dir }}
      run: |
        set -eo pipefail
        . "${RECIPE_UPGRADE_BUILD_DIR}/init-build-env"
        python3 "${GITHUB_ACTION_PATH}/upgrade.py" \
          --recipe "${RECIPE}" \
          --version "${VERSION}" \
          --machines "${MACHINES}" \
          --out "${OUT_DIR}"
