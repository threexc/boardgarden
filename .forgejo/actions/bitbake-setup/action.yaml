name: 'bitbake-setup'
description: 'Initialise a bitbake build tree with bitbake-setup from PyPI (run via uvx), with optional source override.'

inputs:
  config_json:
    description: 'Path to the bitbake-setup config.json (e.g. boardgarden/.forgejo/bitbake-configs/meta-riscv-oe-nodistro-master.conf.json)'
    required: true
  positions:
    description: >-
      Positional selectors passed to bitbake-setup after config_json, one per line
      (e.g. "nodistro\nmachine/muse-pi-pro" or "poky\ndistro/poky\nmachine/qemuriscv64").
    required: true
  source_override:
    description: 'Source override name (looked up in overrides_dir). Use "none" or leave empty to skip.'
    required: false
    default: 'none'
  custom_sources:
    description: >-
      Ad-hoc source overrides, one per line as "<source> <git uri> <branch>"
      (e.g. "openembedded-core https://git.openembedded.org/openembedded-core master-next"),
      where <source> is a key under "sources" in config_json. Takes
      precedence over source_override when non-empty.
    required: false
    default: ''
  overrides_dir:
    description: 'Directory holding *-override.json files.'
    required: false
    default: 'boardgarden/.forgejo/bitbake-configs'
  bitbake_setup_version:
    description: 'bitbake-setup version from PyPI (default: latest)'
    required: false
    default: ''
  working_directory:
    description: >-
      Directory to run bitbake-setup in (config_json and overrides_dir are
      resolved relative to it).
      Needed because "working-directory" on the caller's step is ignored
      for "uses" steps.
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      env:
        # The default tool cache (/opt/hostedtoolcache) can be a root-owned
        # volume when running in a container as a non-root user.
        RUNNER_TOOL_CACHE: ${{ runner.temp }}/toolcache

    - name: bitbake-setup init
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        CONFIG_JSON: ${{ inputs.config_json }}
        POSITIONS: ${{ inputs.positions }}
        SOURCE_OVERRIDE: ${{ inputs.source_override }}
        CUSTOM_SOURCES: ${{ inputs.custom_sources }}
        OVERRIDES_DIR: ${{ inputs.overrides_dir }}
        BITBAKE_SETUP_VERSION: ${{ inputs.bitbake_setup_version }}
      run: |
        set -euo pipefail

        override_arg=()
        config_json="${CONFIG_JSON}"
        if [ -n "${CUSTOM_SOURCES//[[:space:]]/}" ]; then
          override_file="$(mktemp --suffix=-override.json)"
          python3 - > "${override_file}" <<'EOF'
        import json, os
        sources = {}
        for line in os.environ["CUSTOM_SOURCES"].splitlines():
            if not line.strip():
                continue
            name, uri, branch = line.split()
            sources[name] = {"git-remote": {
                "branch": branch,
                "rev": branch,
                "remotes": {"origin": {"uri": uri}},
            }}
        print(json.dumps({"description": "custom source overrides",
                          "sources": sources, "version": "1.0"}, indent=4))
        EOF
          cat "${override_file}"
          override_arg=(--source-overrides "${override_file}")
        elif [ "${SOURCE_OVERRIDE}" != "none" ] && [ -n "${SOURCE_OVERRIDE}" ]; then
          override_file="${OVERRIDES_DIR}/${SOURCE_OVERRIDE}-override.json"
          override_arg=(--source-overrides "${override_file}")

          # Overrides that point at a github.com branch (e.g. a dev fork/branch
          # of meta-riscv) may carry their own config_json in that branch's
          # bitbake-registry/ dir, generated to match that branch's layers.
          # Prefer it over our checked-in copy so e.g. new machines on the
          # branch are picked up without updating boardgarden. Falls back to
          # the local config_json when the branch has no matching file (e.g.
          # non-github remotes like oe-core-master-next).
          remote_uri=$(grep -m1 '"uri"' "${override_file}" | sed -E 's/.*"uri"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          remote_branch=$(grep -m1 '"branch"' "${override_file}" | sed -E 's/.*"branch"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          if [[ "${remote_uri}" == *"github.com"* ]] && [ -n "${remote_branch}" ]; then
            repo_path="${remote_uri#*github.com/}"
            repo_path="${repo_path%.git}"
            raw_url="https://raw.githubusercontent.com/${repo_path}/refs/heads/${remote_branch}/bitbake-registry/$(basename "${CONFIG_JSON}")"
            remote_config="$(mktemp --suffix=.conf.json)"
            if curl -fsSL "${raw_url}" -o "${remote_config}"; then
              config_json="${remote_config}"
            else
              echo "::warning::no branch config at ${raw_url}, using local ${CONFIG_JSON}"
              rm -f "${remote_config}"
            fi
          fi
        fi

        positions=()
        while IFS= read -r line; do
          line="${line#"${line%%[![:space:]]*}"}"   # ltrim
          line="${line%"${line##*[![:space:]]}"}"   # rtrim
          [ -z "$line" ] && continue
          positions+=("$line")
        done <<< "${POSITIONS}"

        uvx --from "bitbake-setup${BITBAKE_SETUP_VERSION:+==${BITBAKE_SETUP_VERSION}}" bitbake-setup \
          --debug \
          init \
          --non-interactive \
          "${override_arg[@]}" \
          "${config_json}" \
          "${positions[@]}"
