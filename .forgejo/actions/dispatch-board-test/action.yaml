name: 'Dispatch Board Test Workflow'
description: 'Triggers riscv-board-test-nightly.yaml for a given machine/image pair via the Forgejo API'

inputs:
  forgejo_url:
    description: 'Base URL of the Forgejo instance'
    required: true
  repository:
    description: 'Repository in owner/name format'
    required: true
  ref:
    description: 'Branch or tag to dispatch against'
    required: true
  dispatch_token:
    description: 'API token with actions:write permission'
    required: true
  machine:
    description: 'MACHINE value to pass to the test workflow'
    required: true
  image:
    description: 'Image name to pass to the test workflow'
    required: true

runs:
  using: composite
  steps:
    - name: dispatch board test workflow
      shell: bash
      env:
        FORGEJO_URL: ${{ inputs.forgejo_url }}
        REPOSITORY: ${{ inputs.repository }}
        REF: ${{ inputs.ref }}
        DISPATCH_TOKEN: ${{ inputs.dispatch_token }}
        MACHINE: ${{ inputs.machine }}
        IMAGE: ${{ inputs.image }}
      run: |
        HTTP_CODE=$(curl -s \
          -o /tmp/dispatch_response.json \
          -w "%{http_code}" \
          -X POST \
          -H "Authorization: token ${DISPATCH_TOKEN}" \
          -H "Content-Type: application/json" \
          "${FORGEJO_URL}/api/v1/repos/${REPOSITORY}/actions/workflows/riscv-board-test-nightly.yaml/dispatches" \
          --data "{
            \"ref\": \"${REF}\",
            \"inputs\": {
              \"image\": \"${IMAGE}\",
              \"machine\": \"${MACHINE}\"
            }
          }")

        echo "HTTP status: ${HTTP_CODE}"
        echo "Response body: $(cat /tmp/dispatch_response.json)"

        if [ "${HTTP_CODE}" != "204" ]; then
          echo "::error::Workflow dispatch failed with HTTP ${HTTP_CODE}"
          exit 1
        fi
