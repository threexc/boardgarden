name: 'Discover machines'
description: >
  Emit a JSON array of Yocto MACHINE names from boards/machines.tsv (the
  index boardfarm-render builds from boards/*/board.yaml, one row per board
  and per variant). Excludes qemu-strategy rows, any board dir lacking a
  strategy.py file (config-only entries with no boot logic), and any row
  whose manifest sets `exclude_from_nightly: true`. Uses only awk + sort (no
  jq dependency).

outputs:
  matrix:
    description: 'JSON array of machine names'
    value: ${{ steps.list.outputs.matrix }}

runs:
  using: composite
  steps:
    - id: list
      shell: bash
      run: |
        set -euo pipefail
        MATRIX=$(
          .forgejo/scripts/machine-info machine,board,strategy,nightly |
          while IFS=$'\t' read -r machine board strategy nightly; do
            [ -f "boards/$board/strategy.py" ] || continue
            [ "$strategy" = "qemu" ] && continue
            [ "$nightly" = "yes" ] || continue
            if [ "$machine" = "-" ]; then
              echo "::error file=boards/$board/board.yaml::missing required 'yocto_machine' field" >&2
              exit 1
            fi
            echo "$machine"
          done | sort -u | awk 'BEGIN{printf "["} {if(NR>1) printf ","; printf "\"%s\"", $0} END{printf "]"}'
        )
        echo "matrix=$MATRIX"
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
