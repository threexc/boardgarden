name: 'Build Yocto image'
description: >
  For a given Yocto MACHINE, run bitbake to build the specified image. Emits
  outputs (board, images_path, deploy_wic) for downstream deploy steps.
  Intended to be used inside a job with a yocto-builder container.

inputs:
  machine:
    description: 'Full Yocto MACHINE value (may include -mainline suffix)'
    required: true
  image:
    description: 'Yocto image to build (e.g. core-image-minimal)'
    required: true
  initramfs_image:
    description: >
      Yocto initramfs image to build, for boards whose board.yaml sets
      tftp.initramfs (e.g. core-image-minimal-initramfs)
    required: false
    default: 'core-image-minimal-initramfs'
  bitbake_setup_override:
    description: 'bitbake-setup source override (none for default)'
    required: false
    default: 'none'
  boardgarden_owner:
    description: 'Owner/org of the mirrored bitbake repo'
    required: true

outputs:
  board:
    description: 'Short board name (TFTP subdirectory), machine with -mainline stripped'
    value: ${{ steps.locate.outputs.board }}
  images_path:
    description: 'Absolute path to tmp/deploy/images on the builder'
    value: ${{ steps.locate.outputs.images_path }}
  deploy_wic:
    description: 'Whether the machine has wic flash artifacts worth deploying'
    value: ${{ steps.locate.outputs.deploy_wic }}
  kernel_version:
    description: 'KERNEL_VERSION of the built kernel (matches `uname -r` on target)'
    value: ${{ steps.kernel_version.outputs.kernel_version }}

runs:
  using: composite
  steps:
    - name: set up locale
      shell: bash
      run: |
        locale-gen en_US.UTF-8

    - name: configure bitbake and layers
      uses: ./.forgejo/actions/bitbake-setup
      with:
        config_json: .forgejo/bitbake-configs/meta-riscv-oe-nodistro-master.conf.json
        overrides_dir: .forgejo/bitbake-configs
        positions: |
          nodistro
          machine/${{ inputs.machine }}
        source_override: ${{ inputs.bitbake_setup_override }}
        repo_owner: ${{ inputs.boardgarden_owner }}

    - name: build image
      shell: bash
      env:
        RISCV_IMAGE: ${{ inputs.image }}
        RISCV_INITRAMFS_IMAGE: ${{ inputs.initramfs_image }}
        RISCV_MACHINE: ${{ inputs.machine }}
      run: |
        . "$GITHUB_WORKSPACE"/bitbake-builds/oe-nodistro-master-meta-riscv/build/init-build-env

        bitbake-config-build \
          enable-fragment \
          core/yocto/root-login-with-empty-password

        # Disable osc-context for systemd to avoid labgrid prompt-detection issues
        # when images are booted during board tests
        echo "PACKAGECONFIG:remove:pn-systemd = \"osc-context\"" >> conf/local.conf

        # add buildinfo to the image
        echo "IMAGE_CLASSES += \"image-buildinfo\"" >> conf/local.conf

        # Boards that boot via kernel+dtb+initramfs (board.yaml sets tftp.initramfs)
        # only need the initramfs image, with its debug module enabled so a shell
        # bootarg can drop to a shell; boards booting a full disk/wic image only
        # need that image. Building both per board wastes build time every night.
        BOARD="${RISCV_MACHINE%-mainline}"
        BOARD_YAML="$GITHUB_WORKSPACE/boards/${BOARD}/board.yaml"
        HAS_INITRAMFS="false"
        if [ -f "${BOARD_YAML}" ] && grep -q '^\s*initramfs:' "${BOARD_YAML}"; then
          HAS_INITRAMFS="true"
          echo 'INITRAMFS_SCRIPTS:append = " initramfs-module-debug"' >> conf/local.conf
        fi

        if [ "${HAS_INITRAMFS}" = "true" ]; then
          EFFECTIVE_IMAGE="${RISCV_INITRAMFS_IMAGE}"
        else
          EFFECTIVE_IMAGE="${RISCV_IMAGE}"
        fi

        bitbake ${EFFECTIVE_IMAGE}

    - name: locate and verify images deploy directory
      id: locate
      shell: bash
      env:
        RISCV_MACHINE: ${{ inputs.machine }}
      run: |
        IMAGES_PATH="$GITHUB_WORKSPACE/bitbake-builds/oe-nodistro-master-meta-riscv/build/tmp/deploy/images"
        if [ ! -d "${IMAGES_PATH}/${RISCV_MACHINE}" ]; then
          echo "::error::Expected images directory not found: ${IMAGES_PATH}/${RISCV_MACHINE}"
          exit 1
        fi
        BOARD="${RISCV_MACHINE%-mainline}"
        BOARD_YAML="$GITHUB_WORKSPACE/boards/${BOARD}/board.yaml"
        DEPLOY_WIC="false"
        if [ -f "${BOARD_YAML}" ] && grep -q '^strategy:[[:space:]]*sdmux' "${BOARD_YAML}"; then
          DEPLOY_WIC="true"
        fi
        echo "images_path=${IMAGES_PATH}" >> "$GITHUB_OUTPUT"
        echo "board=${BOARD}" >> "$GITHUB_OUTPUT"
        echo "deploy_wic=${DEPLOY_WIC}" >> "$GITHUB_OUTPUT"

    - name: get kernel version
      id: kernel_version
      shell: bash
      env:
        RISCV_MACHINE: ${{ inputs.machine }}
        IMAGES_PATH: ${{ steps.locate.outputs.images_path }}
      run: |
        # The kernel's do_deploy always drops Image[.ext]--<version>-<machine>-<datetime>.bin
        # (KERNEL_IMAGETYPE varies by BSP - Image, Image.gz, etc.) alongside the dtb,
        # regardless of which image recipe pulled virtual/kernel in - unlike a rootfs
        # manifest, which initramfs images don't write at all, or a modules tarball,
        # which isn't deployed when the kernel has no loadable modules. Its embedded
        # version - e.g. "7.2.2+git0+52c36105f7-r0" - comes straight from the deploy
        # filename rather than the kernel recipe's own PV, which may not agree at all
        # across builds of the same source.
        IMAGE_DIR="${IMAGES_PATH}/${RISCV_MACHINE}"
        shopt -s nullglob
        CANDIDATES=("${IMAGE_DIR}"/Image*--*-"${RISCV_MACHINE}"-*.bin)
        shopt -u nullglob
        if [ ${#CANDIDATES[@]} -eq 0 ]; then
          echo "::error::no Image*--*-${RISCV_MACHINE}-*.bin found in ${IMAGE_DIR}"
          exit 1
        fi

        BASENAME=$(basename "${CANDIDATES[0]}")
        KERNEL_VERSION="${BASENAME#Image*--}"
        KERNEL_VERSION="${KERNEL_VERSION%-${RISCV_MACHINE}-*.bin}"
        KERNEL_VERSION="${KERNEL_VERSION%%+*}"
        echo "kernel_version=${KERNEL_VERSION}" >> "$GITHUB_OUTPUT"

    - name: deploy raw initramfs cpio.gz as uRamdisk
      shell: bash
      env:
        RISCV_MACHINE: ${{ inputs.machine }}
        RISCV_INITRAMFS_IMAGE: ${{ inputs.initramfs_image }}
        IMAGES_PATH: ${{ steps.locate.outputs.images_path }}
      run: |
        BOARD="${RISCV_MACHINE%-mainline}"
        BOARD_YAML="$GITHUB_WORKSPACE/boards/${BOARD}/board.yaml"
        if [ ! -f "${BOARD_YAML}" ] || ! grep -q '^\s*initramfs:' "${BOARD_YAML}"; then
          exit 0
        fi

        # boot_cmd uses $ramdisk_addr_r:$filesize (explicit size), which
        # skips legacy-uImage header auto-detection in U-Boot - it loads
        # whatever's at that address raw. So deploy the raw cpio.gz as-is;
        # a mkimage/uImage-wrapped ramdisk here just leaves its header
        # unstripped in front of the data the kernel tries to unpack.
        IMAGE_DIR="${IMAGES_PATH}/${RISCV_MACHINE}"
        CPIO_GZ="${IMAGE_DIR}/${RISCV_INITRAMFS_IMAGE}-${RISCV_MACHINE}.cpio.gz"
        cp "${CPIO_GZ}" "${IMAGE_DIR}/uRamdisk"
