name: 'Build Yocto image'
description: >
  For a given Yocto MACHINE, run bitbake to build the specified image. Emits
  outputs (board, images_path, deploy_wic) for downstream deploy steps.
  Intended to be used inside a job with a yocto-builder container.

inputs:
  machine:
    description: 'Full Yocto MACHINE value (may include -mainline suffix)'
    required: true
  image:
    description: 'Yocto image to build (e.g. core-image-minimal)'
    required: true
  bitbake_setup_override:
    description: 'bitbake-setup source override (none for default)'
    required: false
    default: 'none'
  boardgarden_owner:
    description: 'Owner/org of the mirrored boardgarden + bitbake repos'
    required: true

outputs:
  board:
    description: 'Short board name (TFTP subdirectory), machine with -mainline stripped'
    value: ${{ steps.locate.outputs.board }}
  images_path:
    description: 'Absolute path to tmp/deploy/images on the builder'
    value: ${{ steps.locate.outputs.images_path }}
  deploy_wic:
    description: 'Whether the machine has wic flash artifacts worth deploying'
    value: ${{ steps.locate.outputs.deploy_wic }}

runs:
  using: composite
  steps:
    - name: set up bitbake, workflows
      shell: bash
      env:
        BOARDGARDEN_OWNER: ${{ inputs.boardgarden_owner }}
      run: |
        locale-gen en_US.UTF-8
        export LANG=en_US.UTF-8
        git clone "${GITHUB_SERVER_URL}/${BOARDGARDEN_OWNER}/boardgarden.git"
        git clone "${GITHUB_SERVER_URL}/${BOARDGARDEN_OWNER}/bitbake.git"

    - name: configure bitbake and layers
      uses: ./.forgejo/actions/bitbake-setup
      with:
        config_json: boardgarden/.forgejo/bitbake-configs/meta-riscv-oe-nodistro-master.conf.json
        positions: |
          nodistro
          machine/${{ inputs.machine }}
        source_override: ${{ inputs.bitbake_setup_override }}

    - name: build image
      shell: bash
      env:
        RISCV_IMAGE: ${{ inputs.image }}
      run: |
        . "$GITHUB_WORKSPACE"/bitbake-builds/oe-nodistro-master-meta-riscv/build/init-build-env

        bitbake-config-build \
          enable-fragment \
          core/yocto/root-login-with-empty-password

        # Disable osc-context for systemd to avoid labgrid prompt-detection issues
        # when images are booted during board tests
        echo "PACKAGECONFIG:remove:pn-systemd = \"osc-context\"" >> conf/local.conf

        # add buildinfo to the image
        echo "IMAGE_CLASSES += \"image-buildinfo\"" >> conf/local.conf

        bitbake ${RISCV_IMAGE}

    - name: locate and verify images deploy directory
      id: locate
      shell: bash
      env:
        RISCV_MACHINE: ${{ inputs.machine }}
      run: |
        IMAGES_PATH="$GITHUB_WORKSPACE/bitbake-builds/oe-nodistro-master-meta-riscv/build/tmp/deploy/images"
        if [ ! -d "${IMAGES_PATH}/${RISCV_MACHINE}" ]; then
          echo "::error::Expected images directory not found: ${IMAGES_PATH}/${RISCV_MACHINE}"
          exit 1
        fi
        BOARD="${RISCV_MACHINE%-mainline}"
        DEPLOY_WIC="false"
        if [ "${RISCV_MACHINE}" = "bananapi-f3" ]; then
          DEPLOY_WIC="true"
        fi
        echo "images_path=${IMAGES_PATH}" >> "$GITHUB_OUTPUT"
        echo "board=${BOARD}" >> "$GITHUB_OUTPUT"
        echo "deploy_wic=${DEPLOY_WIC}" >> "$GITHUB_OUTPUT"
