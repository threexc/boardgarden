name: 'Recipe upgrade: report'
description: >
  Bundle recipe-upgrade-prepare's layer patches with per-machine build
  results and failure logs into out_dir. Patch subjects get a "WIP: " prefix
  if any patch refresh or build failed.

inputs:
  recipe:
    description: 'Recipe that was upgraded'
    required: true
  old_version:
    description: 'Version before the upgrade'
    required: true
  new_version:
    description: 'Version after the upgrade'
    required: true
  machines:
    description: 'JSON array of machines that were built'
    required: true
  refresh_failed:
    description: '"true" if any patch could not be refreshed automatically'
    required: true
  artifacts_dir:
    description: >
      Downloaded artifacts: upgrade-patches/ (prepare out_dir), plus
      built-<machine>/ for each successful build and logs-<machine>/ for each
      failed one
    required: true
  out_dir:
    description: 'Directory to assemble the report in'
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
        OLD: ${{ inputs.old_version }}
        NEW: ${{ inputs.new_version }}
        MACHINES: ${{ inputs.machines }}
        WIP: ${{ inputs.refresh_failed }}
        ARTIFACTS: ${{ inputs.artifacts_dir }}
        OUT: ${{ inputs.out_dir }}
      run: |
        set -euo pipefail
        mkdir -p "${OUT}/logs"
        cp -r "${ARTIFACTS}/upgrade-patches/." "${OUT}/"
        {
          echo "# ${RECIPE}: ${OLD} -> ${NEW}"
          echo
          echo "| machine | build |"
          echo "|---|---|"
          for m in $(echo "${MACHINES}" | tr -d '[]"' | tr ',' ' '); do
            if [ -d "${ARTIFACTS}/built-${m}" ]; then
              echo "| ${m} | pass |"
            else
              WIP=true
              echo "| ${m} | fail |"
              if [ -d "${ARTIFACTS}/logs-${m}" ]; then
                cp -r "${ARTIFACTS}/logs-${m}" "${OUT}/logs/${m}"
              fi
            fi
          done
          echo
          echo '```'
          cat "${OUT}/refresh.log"
          echo '```'
        } > "${OUT}/RESULTS.md"

        if [ "${WIP}" = true ]; then
          find "${OUT}" -name '*.patch' -exec sed -i '0,/^Subject: \[PATCH\] /s//&WIP: /' {} +
          echo "::warning::${RECIPE} ${OLD} -> ${NEW} needs manual work, see RESULTS.md"
        fi
        cat "${OUT}/RESULTS.md"
        cat "${OUT}/RESULTS.md" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
