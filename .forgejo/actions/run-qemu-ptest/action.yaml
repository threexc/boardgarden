name: 'Run QEMU ptest'
description: >
  Boot the ptest_image_<package> artifact from build-ptest-image with the
  boards/<machine>/env.yaml labgrid env, run ptest-runner, and upload the HTML report.
  Intended to be used inside a job with a lg-operator container, after
  actions/checkout.

inputs:
  package:
    description: 'Package whose ptest image to boot (selects the artifact and report dir)'
    required: true
  machine:
    description: 'qemu board under boards/ to boot with, matching build-ptest-image'
    required: false
    default: 'qemuriscv64'
  ptest_timeout:
    description: 'Seconds to wait for ptest-runner to finish'
    required: false
    default: '1200'
  report_ssh_key:
    description: 'Private key for reporter@<tftp_server>'
    required: true
  ssh_known_hosts:
    description: 'known_hosts covering the report server'
    required: true
  tftp_server:
    description: 'Hostname of the report server'
    required: true

runs:
  using: composite
  steps:
    # build-ptest-image already named these as board.yaml's images expect.
    - name: download images
      uses: actions/download-artifact@v3
      with:
        name: ptest_image_${{ inputs.package }}
        path: /home/labgrid

    - name: install uv
      uses: astral-sh/setup-uv@v5
      env:
        # /opt/hostedtoolcache is a runner-mounted volume owned by root,
        # not the image's chown'd copy - redirect to a path labgrid owns.
        RUNNER_TOOL_CACHE: /home/labgrid/hostedtoolcache
      with:
        working-directory: ${{ github.workspace }}
        enable-cache: true

    - name: run ptests
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        MACHINE: ${{ inputs.machine }}
        PTEST_TIMEOUT: ${{ inputs.ptest_timeout }}
      run: |
        if grep -q -- '-accel kvm' "boards/${MACHINE}/env.yaml" && [ ! -w /dev/kvm ]; then
          echo "::warning::/dev/kvm not usable in this container, ${MACHINE} falls back to TCG"
        fi
        uv sync
        uv run pytest -vv --html=report.html --self-contained-html \
          --lg-env "boards/${MACHINE}/env.yaml" \
          common/src/boardfarm_common/ptest

    - name: install report SSH key
      if: ${{ !cancelled() }}
      uses: ./.forgejo/actions/setup-ssh
      with:
        ssh_private_key: ${{ inputs.report_ssh_key }}
        ssh_known_hosts: ${{ inputs.ssh_known_hosts }}
        key_filename: id_rsa_report

    - name: deploy report
      if: ${{ !cancelled() }}
      shell: bash
      env:
        PTEST_PACKAGE: ${{ inputs.package }}
        TFTP_SERVER: ${{ inputs.tftp_server }}
      run: |
        REPORT_DIR="yocto/oe-core/${PTEST_PACKAGE}/$(date +%Y%m%d)/${{ forgejo.run_id }}"
        RSH="ssh -i ~/.ssh/id_rsa_report -o StrictHostKeyChecking=accept-new"
        ${RSH} "reporter@${TFTP_SERVER}" "mkdir -p /testresults/$REPORT_DIR"
        rsync -avz --omit-link-times -e "${RSH}" \
          "${{ github.workspace }}/report.html" \
          "reporter@${TFTP_SERVER}:/testresults/$REPORT_DIR/"
