name: 'Run board tests'
description: >
  For a given Yocto MACHINE, drive labgrid to run the corresponding pytest
  suite against a physical board, then upload the HTML report. Intended to
  be used inside a job with a lg-operator container.

inputs:
  machine:
    description: 'Full Yocto MACHINE value (may include -mainline suffix)'
    required: true
  kernel_version:
    description: 'Expected kernel version string, checked against `uname -a` on target'
    required: true
  lg_exporter_ssh_key:
    description: 'Private key for labgrid@<coordinator>'
    required: true
  tftp_server_ssh_key:
    description: 'Private key for <tftp_user>@<tftp_server>'
    required: true
  report_ssh_key:
    description: 'Private key for reporter@<tftp_server>'
    required: true
  ssh_known_hosts:
    description: 'known_hosts covering the coordinator + TFTP/report server'
    required: true
  tftp_server:
    description: 'Hostname of the TFTP + report server'
    required: true
  tftp_user:
    description: 'SSH user on the TFTP server'
    required: true
  lg_coordinator:
    description: 'Hostname of the labgrid coordinator/exporter'
    required: true
  reports_root:
    description: 'Subdirectory prefix under /testresults/ on the report server'
    required: false
    default: 'yocto/meta-riscv'

runs:
  using: composite
  steps:
    - name: set up keys
      shell: bash
      working-directory: /home/labgrid
      env:
        LG_EXPORTER_SSH_KEY: ${{ inputs.lg_exporter_ssh_key }}
        TFTP_SERVER_SSH_KEY: ${{ inputs.tftp_server_ssh_key }}
        SSH_KNOWN_HOSTS: ${{ inputs.ssh_known_hosts }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        umask 077
        printf '%s\n' "$LG_EXPORTER_SSH_KEY" > ~/.ssh/id_rsa
        printf '%s\n' "$TFTP_SERVER_SSH_KEY" > ~/.ssh/id_rsa_tftp
        printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
        # Fallback for hosts not covered by SSH_KNOWN_HOSTS — e.g., labgrid's
        # internal ssh subprocess dialing short hostnames the secret doesn't
        # explicitly list. TOFU per ephemeral container; safe on Tailscale mesh.
        cat > ~/.ssh/config <<'EOF'
        Host *
            StrictHostKeyChecking accept-new
        EOF
        chmod 600 ~/.ssh/config

    - name: install uv
      uses: astral-sh/setup-uv@v5
      env:
        # /opt/hostedtoolcache is a runner-mounted volume owned by root,
        # not the image's chown'd copy - redirect to a path labgrid owns.
        RUNNER_TOOL_CACHE: /home/labgrid/hostedtoolcache
      with:
        working-directory: ${{ github.workspace }}
        enable-cache: true

    - name: Fetch latest rootfs
      shell: bash
      working-directory: /home/labgrid
      env:
        RISCV_MACHINE: ${{ inputs.machine }}
        TFTP_USER: ${{ inputs.tftp_user }}
        TFTP_SERVER: ${{ inputs.tftp_server }}
      run: |
        grep -qx sdmux <<< "$("$GITHUB_WORKSPACE"/.forgejo/scripts/machine-info strategy "$RISCV_MACHINE")" || exit 0

        # TFTP subdir comes from the first board for this machine, as in
        # build-yocto-image.
        TFTP_SUBDIR=$("$GITHUB_WORKSPACE"/.forgejo/scripts/machine-info tftp_subdir "$RISCV_MACHINE" | sed -n 1p)

        LATEST_WIC=$(ssh -i ~/.ssh/id_rsa_tftp \
          ${TFTP_USER}@${TFTP_SERVER} "readlink /srv/tftp/${TFTP_SUBDIR}/${TFTP_SUBDIR}.rootfs-latest.wic.gz")
        LATEST_BMAP=$(ssh -i ~/.ssh/id_rsa_tftp \
          ${TFTP_USER}@${TFTP_SERVER} "readlink /srv/tftp/${TFTP_SUBDIR}/${TFTP_SUBDIR}.rootfs-latest.wic.bmap")
        rsync -avz -e "ssh -i ~/.ssh/id_rsa_tftp" \
          ${TFTP_USER}@${TFTP_SERVER}:/srv/tftp/${TFTP_SUBDIR}/${LATEST_WIC} .
        rsync -avz -e "ssh -i ~/.ssh/id_rsa_tftp" \
          ${TFTP_USER}@${TFTP_SERVER}:/srv/tftp/${TFTP_SUBDIR}/${LATEST_BMAP} .
        ln -sf ${LATEST_WIC} ${TFTP_SUBDIR}.rootfs-latest.wic.gz
        ln -sf ${LATEST_BMAP} ${TFTP_SUBDIR}.rootfs-latest.wic.bmap

    - name: Fetch latest fastboot images
      shell: bash
      working-directory: /home/labgrid
      env:
        RISCV_MACHINE: ${{ inputs.machine }}
        TFTP_USER: ${{ inputs.tftp_user }}
        TFTP_SERVER: ${{ inputs.tftp_server }}
      run: |
        set -euo pipefail
        # Any board sharing this machine may be the one flashed over fastboot.
        FASTBOOT=$("$GITHUB_WORKSPACE"/.forgejo/scripts/machine-info strategy,board,image_dir "$RISCV_MACHINE" | awk -F'\t' '$1 == "fastboot"' | sed -n 1p)
        [ -n "${FASTBOOT}" ] || exit 0
        IFS=$'\t' read -r _ FASTBOOT_BOARD IMAGE_DIR <<< "${FASTBOOT}"
        # The TFTP subdir comes from the first board for this machine, as in
        # build-yocto-image.
        TFTP_SUBDIR=$("$GITHUB_WORKSPACE"/.forgejo/scripts/machine-info tftp_subdir "$RISCV_MACHINE" | sed -n 1p)
        FASTBOOT_DIR="${GITHUB_WORKSPACE}/boards/${FASTBOOT_BOARD}"

        mkdir -p "${IMAGE_DIR}"
        rsync -avz -e "ssh -i ~/.ssh/id_rsa_tftp" \
          "${TFTP_USER}@${TFTP_SERVER}:/srv/tftp/${TFTP_SUBDIR}/fastboot/" "${IMAGE_DIR}/"
        # Partition layouts aren't build output; they live in the board dir.
        cp "${FASTBOOT_DIR}"/*.json "${IMAGE_DIR}/"

    - name: run labgrid-client
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        RISCV_MACHINE: ${{ inputs.machine }}
        VERSION: ${{ inputs.kernel_version }}
      run: |
        uv sync
        # Base machines are reserved by the places' machine tag, so boards
        # sharing one (RAM variants, etc.) can land on any of them. A board
        # variant's machine isn't a place tag (a place carries one machine
        # tag), so reserve its place by name instead.
        read -r VARIANT PLACE <<< "$("$GITHUB_WORKSPACE"/.forgejo/scripts/machine-info variant,remote_place "$RISCV_MACHINE" | sed -n 1p)"
        if [ -n "$VARIANT" ] && [ "$VARIANT" != "-" ]; then
          RESERVE_FILTER="name=$PLACE"
        else
          RESERVE_FILTER="machine=$RISCV_MACHINE"
        fi
        eval `uv run labgrid-client reserve --shell $RESERVE_FILTER`
        echo $LG_TOKEN
        # Multiple boards/<name> dirs can share the same yocto_machine (RAM
        # variants, etc.), so which one the reservation actually allocated
        # can't be guessed from RISCV_MACHINE alone - it has to come from
        # the reservation's own result. `wait` prints the resolved
        # Reservation, including "allocations:\n  main: <place>".
        WAIT_OUTPUT=$(uv run labgrid-client wait | tee /dev/stderr)
        ALLOCATED_PLACE=$(echo "$WAIT_OUTPUT" | awk '
          /^allocations:/ { in_alloc=1; next }
          /^[a-z]/ { in_alloc=0 }
          in_alloc && /^  main:/ { print $2; exit }
        ')
        # The client file picks the boot method: client.yaml for the base
        # machine, client-<variant>.yaml for a variant's.
        read -r BOARD CLIENT <<< "$("$GITHUB_WORKSPACE"/.forgejo/scripts/machine-info remote_place,board,client "$RISCV_MACHINE" |
          awk -F'\t' -v p="$ALLOCATED_PLACE" '$1 == p { print $2, $3; exit }')"
        if [ -z "$BOARD" ]; then
          echo "::error::no board for ${RISCV_MACHINE} has remote_place: ${ALLOCATED_PLACE}"
          exit 1
        fi
        echo "resolved board: ${BOARD} (place: ${ALLOCATED_PLACE}, env: ${CLIENT})"
        uv run labgrid-client -p + lock
        uv run labgrid-client -p + show
        EXIT_CODE=1
        for ATTEMPT in 1 2 3; do
          echo "Test attempt ${ATTEMPT} of 3"
          TESTS="common/src/boardfarm_common/tests"
          [ -d "boards/$BOARD/pytest" ] && TESTS="$TESTS boards/$BOARD/pytest"
          if BOARD="$BOARD" uv run pytest -vvv --html=report.html --self-contained-html --lg-env "boards/$BOARD/$CLIENT" $TESTS; then
            echo "Tests passed on attempt ${ATTEMPT}. Releasing reservation"
            EXIT_CODE=0
            break
          else
            echo "Attempt ${ATTEMPT} failed"
          fi
        done
        if [ $EXIT_CODE -ne 0 ]; then
          echo "All 3 pytest attempts failed"
        fi
        uv run labgrid-client -p + -c "boards/$BOARD/$CLIENT" pw off
        uv run labgrid-client -p + release
        exit $EXIT_CODE

    - name: install report SSH key
      if: ${{ !cancelled() }}
      shell: bash
      env:
        REPORT_SSH_KEY: ${{ inputs.report_ssh_key }}
      run: |
        umask 077
        printf '%s\n' "$REPORT_SSH_KEY" > ~/.ssh/id_rsa_report

    - name: Deploy internal reports
      if: ${{ !cancelled() }}
      shell: bash
      env:
        RISCV_MACHINE: ${{ inputs.machine }}
        TFTP_SERVER: ${{ inputs.tftp_server }}
        REPORTS_ROOT: ${{ inputs.reports_root }}
      run: |
        REPORT_DIR="${REPORTS_ROOT}/${RISCV_MACHINE}/$(date +%Y%m%d)/${{ forgejo.run_id }}"
        ssh -i ~/.ssh/id_rsa_report "reporter@${TFTP_SERVER}" "mkdir -p /testresults/$REPORT_DIR"
        rsync -av -e "ssh -i ~/.ssh/id_rsa_report" \
          "${{ github.workspace }}/report.html" \
          "reporter@${TFTP_SERVER}:/testresults/$REPORT_DIR/"
