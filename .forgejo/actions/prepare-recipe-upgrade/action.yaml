name: 'Prepare recipe upgrade'
description: >
  Set up a meta-riscv build tree, check upstream for a newer tag of a recipe
  (linux-mainline, u-boot, opensbi), bump the recipe to it, and refresh the
  patches each candidate MACHINE applies. Emits one format-patch file per
  touched layer under out_dir/<layer>/ for build-yocto-image's layer_patches
  input. Intended to run inside a yocto-builder container.

inputs:
  recipe:
    description: 'Recipe to upgrade (see RECIPES in upgrade.py)'
    required: true
  version:
    description: 'Target upstream version (empty for the newest tag)'
    required: false
    default: ''
  machines:
    description: 'JSON array of candidate machines; filtered to those using the recipe'
    required: true
  bitbake_setup_override:
    description: 'bitbake-setup source override (none for default)'
    required: false
    default: 'none'
  boardgarden_owner:
    description: 'Owner/org of the mirrored bitbake repo'
    required: true
  out_dir:
    description: 'Where to write layer patches and refresh.log'
    required: true

outputs:
  status:
    description: '"upgraded" or "current" (no newer tag)'
    value: ${{ steps.upgrade.outputs.status }}
  old_version:
    description: 'Version before the upgrade'
    value: ${{ steps.upgrade.outputs.old_version }}
  new_version:
    description: 'Version after the upgrade'
    value: ${{ steps.upgrade.outputs.new_version }}
  machines:
    description: 'JSON array of machines that use the recipe'
    value: ${{ steps.upgrade.outputs.machines }}
  refresh_failed:
    description: '"true" if any patch could not be refreshed automatically'
    value: ${{ steps.upgrade.outputs.refresh_failed }}

runs:
  using: composite
  steps:
    - name: set up locale
      shell: bash
      run: |
        locale-gen en_US.UTF-8

    - name: pick initial machine
      id: first
      shell: bash
      env:
        MACHINES: ${{ inputs.machines }}
      run: |
        echo "machine=$(python3 -c 'import json, sys; print(json.loads(sys.argv[1])[0])' "${MACHINES}")" >> "$GITHUB_OUTPUT"

    - name: configure bitbake and layers
      uses: ./.forgejo/actions/bitbake-setup
      with:
        config_json: .forgejo/bitbake-configs/meta-riscv-oe-nodistro-master.conf.json
        overrides_dir: .forgejo/bitbake-configs
        positions: |
          nodistro
          machine/${{ steps.first.outputs.machine }}
        source_override: ${{ inputs.bitbake_setup_override }}
        repo_owner: ${{ inputs.boardgarden_owner }}

    - name: bump recipe and refresh patches
      id: upgrade
      shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
        VERSION: ${{ inputs.version }}
        MACHINES: ${{ inputs.machines }}
        OUT_DIR: ${{ inputs.out_dir }}
      run: |
        set -eo pipefail
        . "$GITHUB_WORKSPACE"/bitbake-builds/oe-nodistro-master-meta-riscv/build/init-build-env
        python3 "$GITHUB_WORKSPACE/.forgejo/actions/prepare-recipe-upgrade/upgrade.py" \
          --recipe "${RECIPE}" \
          --version "${VERSION}" \
          --machines "${MACHINES}" \
          --out "${OUT_DIR}"
