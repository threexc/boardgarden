name: yocto-build-only

on:
  schedule:
    # run weekly by default
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      bitbake_setup_override:
        description: 'bitbake-setup source override to apply (none for default)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - meta-riscv-tgamblin-review
          - meta-riscv-tgamblin-fixes
      distro:
        description: 'Distro: testv (meta-testv) or nodistro (oe-core)'
        required: true
        default: 'testv'
        type: choice
        options:
          - testv
          - nodistro
      image:
        description: 'Image to build'
        required: true
        default: 'core-image-full-cmdline'
        type: choice
        options:
          - core-image-minimal
          - core-image-full-cmdline
          - core-image-ptest-python3
      machines:
        description: >
          JSON array of machines to override the default layer-sanity list.
          Leave blank to build the default set (meta-riscv machines without
          local hardware).
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: yocto-build
    strategy:
      matrix:
        # Layer-sanity build set: meta-riscv machines with no local hardware.
        # Disjoint from yocto-build-and-test's auto-derived board list.
        machine: >-
          ${{
            inputs.machines != ''
              && fromJSON(inputs.machines)
              || fromJSON('["beaglev-ahead", "eswin-ebc77-mainline", "milkv-duo"]')
          }}
    container:
      image: ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/yocto-builder:v1
      options: --add-host ${{ vars.TFTP_SERVER_HOST }}:${{ vars.TFTP_SERVER_IP }}
      volumes:
        - /buildcache:/buildcache
      env:
        DL_DIR: "/buildcache/downloads"
        SSTATE_DIR: "/buildcache/sstate-cache"
    steps:
      - uses: actions/checkout@v4
      - id: config
        uses: ./.forgejo/actions/board-yocto-config
        with:
          machine: ${{ matrix.machine }}
          image: ${{ inputs.image || 'core-image-full-cmdline' }}
          distro: ${{ inputs.distro || 'testv' }}
      - id: build
        uses: https://forgejo.baylibre.com/tgamblin/build-yocto-image@main
        with:
          config_json: ${{ steps.config.outputs.config_json }}
          positions: ${{ steps.config.outputs.positions }}
          machine: ${{ matrix.machine }}
          targets: ${{ steps.config.outputs.targets }}
          fragments: ${{ steps.config.outputs.fragments }}
          local_conf: ${{ steps.config.outputs.local_conf }}
          source_override: ${{ inputs.bitbake_setup_override || 'none' }}
          overrides_dir: .forgejo/bitbake-configs
