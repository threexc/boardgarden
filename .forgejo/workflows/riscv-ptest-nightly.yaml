name: riscv-ptest-nightly

on:
  workflow_dispatch:
    inputs:
      bitbake_setup_override:
        description: 'bitbake-setup source override to apply (none for default)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - oe-core-master-next
      package:
        description: 'Package to build and test'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - bzip2
          - coreutils
          - gzip
          - parted
          - python3-cryptography
          - tar
          - xz

env:
  TFTP_SERVER: ${{ vars.TFTP_SERVER_HOST }}

jobs:
  build-riscv-image:
    runs-on: qemu-test
    strategy:
      matrix:
        package: >-
          ${{
            inputs.package != 'all' && inputs.package != '' && fromJSON(format('["{0}"]', inputs.package)) ||
            fromJSON('["bzip2", "coreutils", "gzip", "parted", "python3-cryptography", "tar", "xz"]')
          }}
    container:
      image: ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/yocto-builder:v1
      volumes:
        - /buildcache:/buildcache
      env:
        BITBAKE_SETUP_OVERRIDE: ${{ inputs.bitbake_setup_override || 'none' }}
        DL_DIR: "/buildcache/downloads"
        SSTATE_DIR: "/buildcache/sstate-cache"
        PERSISTENT_TMPDIR_BASE: "/buildcache/tmp"
    steps:
      - uses: actions/checkout@v4
      - id: build
        uses: https://forgejo.baylibre.com/tgamblin/build-ptest-image@main
        with:
          package: ${{ matrix.package }}
          config_json: ./.forgejo/bitbake-configs/poky-master-dl-sstate-passthrough.conf.json
          source_override: ${{ env.BITBAKE_SETUP_OVERRIDE }}
          overrides_dir: .forgejo/bitbake-configs
      - uses: ./.forgejo/actions/stage-ptest-images
        with:
          package: ${{ matrix.package }}
          machine: qemuriscv64
          images_path: ${{ steps.build.outputs.images_path }}

  run-ptests:
    runs-on: qemu-test
    needs: build-riscv-image
    strategy:
      matrix:
        package: >-
          ${{
            inputs.package != 'all' && inputs.package != '' && fromJSON(format('["{0}"]', inputs.package)) ||
            fromJSON('["bzip2", "coreutils", "gzip", "parted", "python3-cryptography", "tar", "xz"]')
          }}
    container:
      image: ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/lg-operator:v1
      options: --add-host ${{ vars.TFTP_SERVER_HOST }}:${{ vars.TFTP_SERVER_IP }}
      env:
        TFTP_SERVER: ${{ vars.TFTP_SERVER_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/run-qemu-ptest
        with:
          package: ${{ matrix.package }}
          report_ssh_key: ${{ secrets.REPORT_SSH_KEY }}
          ssh_known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          tftp_server: ${{ vars.TFTP_SERVER_HOST }}
