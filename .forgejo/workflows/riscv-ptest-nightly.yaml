on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      bitbake_setup_override:
        description: 'bitbake-setup source override to apply (none for default)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - oe-core-master-next
      package:
        description: 'Package to build and test'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - bzip2
          - coreutils
          - gnutls
          - gzip
          - parted
          - python3-cryptography
          - tar
          - xz
jobs:
  build-riscv-image:
    runs-on: docker
    strategy:
      matrix:
        package: >-
          ${{
            inputs.package != 'all' && inputs.package != '' && fromJSON(format('["{0}"]', inputs.package)) ||
            fromJSON('["bzip2", "coreutils", "gnutls", "gzip", "parted", "python3-cryptography", "tar", "xz"]')
          }}
    container:
      image: tgamblin/yocto-builder
      volumes:
        - /auto/runner/buildcache:/buildcache
      env:
        BITBAKE_SETUP_OVERRIDE: ${{ inputs.bitbake_setup_override || 'none' }}
        DL_DIR: "/buildcache/downloads"
        RISCV_MACHINE: "qemuriscv64"
        PTEST_PACKAGE: ${{ matrix.package }}
        SSTATE_DIR: "/buildcache/sstate-cache"
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: clone boardgarden
        uses: ./.forgejo/actions/git-clone
        with:
          url: https://forgejo.oryx-coho.ts.net/tgamblin/boardgarden.git
          path: boardgarden

      - name: clone bitbake
        uses: ./.forgejo/actions/git-clone
        with:
          url: https://forgejo.oryx-coho.ts.net/tgamblin/bitbake.git
          path: bitbake

      - name: configure bitbake and layers
        run: |
          OVERRIDE_ARG=""
          if [ "${BITBAKE_SETUP_OVERRIDE}" != "none" ]; then
            OVERRIDE_ARG="--source-override boardgarden/.forgejo/bitbake-configs/${BITBAKE_SETUP_OVERRIDE}-override.json"
          fi

          ./bitbake/bin/bitbake-setup \
            --debug \
            init \
            --non-interactive \
            ${OVERRIDE_ARG} \
            ./.forgejo/bitbake-configs/poky-master-dl-sstate-passthrough.conf.json \
            poky \
            distro/poky \
            machine/${RISCV_MACHINE}

      - name: build core-image-ptest image
        working-directory: /home/yoctouser/yocto-build
        run: |
          . "$GITHUB_WORKSPACE"/bitbake-builds/poky-master/build/init-build-env
          echo "IMAGE_FSTYPES += \" ext4\"" >> conf/local.conf

          bitbake-config-build \
            enable-fragment \
            core/yocto/root-login-with-empty-password
          
          bitbake core-image-ptest-${PTEST_PACKAGE}
        env:
          PTEST_PACKAGE: ${{ matrix.package }}
      - name: Archive qemuriscv64 bios
        uses: actions/upload-artifact@v3
        with:
          name: ptest_image_bios_${{ matrix.package }}
          path: ${{ github.workspace }}/bitbake-builds/poky-master/build/tmp/deploy/images/qemuriscv64/fw_jump.elf
      - name: Archive qemuriscv64 kernel
        uses: actions/upload-artifact@v3
        with:
          name: ptest_image_kernel_${{ matrix.package }}
          path: ${{ github.workspace }}/bitbake-builds/poky-master/build/tmp/deploy/images/qemuriscv64/Image
      - name: Archive qemuriscv64 ext4 rootfs
        uses: actions/upload-artifact@v3
        with:
          name: ptest_image_ext4_${{ matrix.package }}
          path: ${{ github.workspace }}/bitbake-builds/poky-master/build/tmp/deploy/images/qemuriscv64/core-image-ptest-*-qemuriscv64.rootfs-*.ext4

  run-ptests:
    runs-on: docker
    needs: build-riscv-image
    strategy:
      matrix:
        package: >-
          ${{
            inputs.package != 'all' && inputs.package != '' && fromJSON(format('["{0}"]', inputs.package)) ||
            fromJSON('["bzip2", "coreutils", "gnutls", "gzip", "parted", "python3-cryptography", "tar", "xz"]')
          }}
    container:
      image: tgamblin/lg-operator
      options: --add-host ecogrid:192.168.40.101 --add-host ecovault:192.168.40.134
    steps:
      - name: Download qemuriscv64 bios
        uses: actions/download-artifact@v3
        with:
          name: ptest_image_bios_${{ matrix.package }}
          path: /home/labgrid/bios_download
      - name: Rename bios
        run: |
          mv /home/labgrid/bios_download/fw_jump.elf /home/labgrid/fw_jump.elf
      - name: Download qemuriscv64 kernel
        uses: actions/download-artifact@v3
        with:
          name: ptest_image_kernel_${{ matrix.package }}
          path: /home/labgrid/kernel_download
      - name: Rename kernel
        run: |
          mv /home/labgrid/kernel_download/Image /home/labgrid/Image
      - name: Download qemuriscv64 ext4 rootfs
        uses: actions/download-artifact@v3
        with:
          name: ptest_image_ext4_${{ matrix.package }}
          path: /home/labgrid/ext4_download
      - name: Rename ext4 image
        run: |
          mv /home/labgrid/ext4_download/*.ext4 /home/labgrid/ptest_image.ext4
      - name: clone boardgarden
        working-directory: /home/labgrid
        run: |
          git clone https://github.com/threexc/boardgarden.git

      - name: set up virtualenv
        working-directory: /home/labgrid/boardgarden
        run: |
          python3 -m venv venv && source venv/bin/activate
          pip install --upgrade pip
          pip install labgrid pytest pytest-html

      - name: run labgrid-client
        working-directory: /home/labgrid/boardgarden
        run: |
          source venv/bin/activate
          pytest -vvv --html=report.html --self-contained-html --lg-env boards/qemuriscv64/env.yaml boards/qemuriscv64/tests/test_ptests.py

      - name: Setup SSH key
        working-directory: /home/labgrid
        env:
          SSH_KEY: ${{ secrets.REPORT_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" >> ~/.ssh/id_rsa
          ssh-keyscan ecovault >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan 100.72.220.81 >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/id_rsa

      - name: test SSH connection
        working-directory: /home/labgrid
        run: |
          # Check if the key is encrypted
          grep "ENCRYPTED" ~/.ssh/id_rsa || echo "Key is not encrypted"

          # Try with explicit key and BatchMode
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa -v reporter@ecovault "echo SSH connection successful" || true
          echo "=== SSH directory contents ==="
          ls -la ~/.ssh/
          echo "=== Known hosts ==="
          cat ~/.ssh/known_hosts
          echo "=== Testing SSH connection ==="
          ssh -v reporter@ecovault "echo SSH connection successful"

      - name: Deploy report
        run: |
          REPORT_DIR="yocto/oe-core/${{ matrix.package }}/$(date +%Y%m%d)/${{ forgejo.run_id }}"
          ssh -o StrictHostKeyChecking=no reporter@ecovault "mkdir -p /testresults/$REPORT_DIR"
          rsync -av /home/labgrid/boardgarden/report.html reporter@ecovault:/testresults/$REPORT_DIR/
