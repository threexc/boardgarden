on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      bitbake_setup_override:
        description: 'bitbake-setup source override to apply (none for default)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - meta-riscv-tgamblin-k1-fixes
          - meta-riscv-tgamblin-k3-fixes
      image:
        description: 'Image to build'
        required: true
        default: 'core-image-minimal'
        type: choice
        options:
          - core-image-minimal
          - core-image-full-cmdline
          - core-image-ptest-python3
      machines:
        description: 'Machines to run against'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - bananapi-f3
          - eswin-ebc77-mainline
          - k3-pico-itx
          - muse-pi-pro
          - nezha-allwinner-d1
          - orangepi-rv2-mainline

env:
  TFTP_SERVER: ${{ vars.TFTP_SERVER_HOST }}
  TFTP_USER: "auto"

jobs:
  build-riscv-image:
    runs-on: tgamblin-build
    strategy:
      matrix:
        machine: >-
          ${{
            inputs.machines != 'all' && inputs.machines != ''
              && fromJSON(format('["{0}"]', inputs.machines))
              || fromJSON('["bananapi-f3", "eswin-ebc77-mainline", "k3-pico-itx", "muse-pi-pro", "nezha-allwinner-d1", "orangepi-rv2-mainline"]')
          }}
    container:
      image: ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/yocto-builder
      options: --add-host ${{ vars.TFTP_SERVER_HOST }}:${{ vars.TFTP_SERVER_IP }}
      volumes:
        - /auto/runner/buildcache:/buildcache
      env:
        BITBAKE_SETUP_OVERRIDE: ${{ inputs.bitbake_setup_override || 'none' }}
        DL_DIR: "/buildcache/downloads"
        RISCV_IMAGE: ${{ inputs.image || 'core-image-minimal' }}
        RISCV_MACHINE: ${{ matrix.machine }}
        SSTATE_DIR: "/buildcache/sstate-cache"

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up bitbake, workflows
        run: |
          locale-gen en_US.UTF-8
          export LANG=en_US.UTF-8
          git clone "${GITHUB_SERVER_URL}/${{ vars.BOARDGARDEN_OWNER }}/boardgarden.git"
          git clone "${GITHUB_SERVER_URL}/${{ vars.BOARDGARDEN_OWNER }}/bitbake.git"

      - name: configure bitbake and layers
        uses: ./.forgejo/actions/bitbake-setup
        with:
          config_json: boardgarden/.forgejo/bitbake-configs/meta-riscv-oe-nodistro-master.conf.json
          positions: |
            nodistro
            machine/${{ matrix.machine }}
          source_override: ${{ env.BITBAKE_SETUP_OVERRIDE }}

      - name: build ${{ inputs.image || 'core-image-minimal' }}
        run: |
          . "$GITHUB_WORKSPACE"/bitbake-builds/oe-nodistro-master-meta-riscv/build/init-build-env

          bitbake-config-build \
            enable-fragment \
            core/yocto/root-login-with-empty-password

          # Disable osc-context for systemd to avoid labgrid prompt-detection issues
          # when images are booted during board tests
          echo "PACKAGECONFIG:remove:pn-systemd = \"osc-context\"" >> conf/local.conf

          # add buildinfo to the image
          echo "IMAGE_CLASSES += \"image-buildinfo\"" >> conf/local.conf

          bitbake ${RISCV_IMAGE}

      - name: locate and verify images deploy directory
        id: locate-images
        run: |
          IMAGES_PATH="$GITHUB_WORKSPACE/bitbake-builds/oe-nodistro-master-meta-riscv/build/tmp/deploy/images"
          if [ ! -d "${IMAGES_PATH}/${RISCV_MACHINE}" ]; then
            echo "::error::Expected images directory not found: ${IMAGES_PATH}/${RISCV_MACHINE}"
            exit 1
          fi
          # Strip -mainline suffix for TFTP directory name
          BOARD="${RISCV_MACHINE%-mainline}"
          # Flag wic deployment for boards that support it
          DEPLOY_WIC="false"
          if [ "${RISCV_MACHINE}" = "bananapi-f3" ]; then
            DEPLOY_WIC="true"
          fi
          echo "IMAGES_PATH=${IMAGES_PATH}" >> "$GITHUB_ENV"
          echo "BOARD=${BOARD}"             >> "$GITHUB_ENV"
          echo "DEPLOY_WIC=${DEPLOY_WIC}"   >> "$GITHUB_ENV"

      - name: run on board (deploy + optional dispatch)
        uses: ./.forgejo/actions/run-on-board
        with:
          ssh_known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          ssh_private_key: ${{ secrets.TFTP_SERVER_SSH_KEY }}
          tftp_server: ${{ env.TFTP_SERVER }}
          tftp_user: ${{ env.TFTP_USER }}
          board: ${{ env.BOARD }}
          machine: ${{ matrix.machine }}
          image: ${{ env.RISCV_IMAGE }}
          images_path: ${{ env.IMAGES_PATH }}
          deploy_wic: ${{ env.DEPLOY_WIC }}
          dispatch: ${{ contains(fromJSON('["bananapi-f3", "muse-pi-pro", "orangepi-rv2-mainline"]'), matrix.machine) }}
          dispatch_token: ${{ secrets.ACTION_DISPATCH }}
          forgejo_url: ${{ github.server_url }}
          ref: ${{ github.ref_name || 'main' }}
          repository: ${{ github.repository }}
