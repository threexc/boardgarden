on:
  push:
    paths:
      - 'boards/**/board.yaml'
      - 'boards/**/client*.yaml'
      - 'boards/**/env*.yaml'
      - 'boards/machines.tsv'
      - 'boards/families/**'
      - 'pyproject.toml'
  pull_request:
  workflow_dispatch:

jobs:
  validate-board-manifests:
    runs-on: light-maintenance
    container:
      image: ghcr.io/astral-sh/uv:python3.12-bookworm
    steps:
      - name: clone boardgarden at test SHA
        shell: bash
        run: |
          mkdir repo && cd repo
          git init -q
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: sync uv environment
        working-directory: repo
        run: uv sync
      - name: validate all board.yaml
        working-directory: repo
        run: uv run boardkit-validate
      - name: check rendered client.yaml is in sync with manifests
        working-directory: repo
        run: uv run boardkit-render --check
