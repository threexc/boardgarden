on:
  repository_dispatch:
    types: [run-board-tests]
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to test'
        required: true
        default: 'core-image-minimal'
        type: choice
        options:
          - core-image-minimal
          - core-image-full-cmdline
          - core-image-ptest-python3
      machine:
        description: 'Machine to run against'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - bananapi-f3
          - muse-pi-pro
          - orangepi-rv2-mainline
env:
  TFTP_SERVER: "ecovault.oryx-coho.ts.net"
  TFTP_USER: "auto"

jobs:
  test-board-boot:
    runs-on: docker-small
    strategy:
      matrix:
        machine: >-
          ${{
            github.event_name == 'repository_dispatch' && fromJSON(format('["{0}"]', github.event.client_payload.machine)) ||
            inputs.machine == 'all' && fromJSON('["bananapi-f3", "muse-pi-pro", "orangepi-rv2-mainline"]') ||
            inputs.machine != 'all' && fromJSON(format('["{0}"]', inputs.machine)) ||
            fromJSON('["bananapi-f3", "muse-pi-pro", "orangepi-rv2-mainline"]')
          }}
    container:
      image: forgejo.oryx-coho.ts.net/tgamblin/lg-operator
      options: --add-host ecogrid:192.168.40.101
      env:
        LG_COORDINATOR: ecogrid
        RISCV_IMAGE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.image || inputs.image || 'core-image-minimal' }}
        RISCV_MACHINE: ${{ matrix.machine }}
        VERSION: 7.0
    steps:
      - name: set up keys
        working-directory: /home/labgrid
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LG_EXPORTER_SSH_KEY }}" > ~/.ssh/id_rsa
          echo "${{ secrets.TFTP_SERVER_SSH_KEY }}" > ~/.ssh/id_rsa_tftp
          chmod 600 ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa_tftp
          ssh-keyscan ecogrid >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan 100.107.94.6 >> ~/.ssh/known_hosts 2>/dev/null

      - name: test SSH connection
        working-directory: /home/labgrid
        run: |
          # Check if the key is encrypted
          grep "ENCRYPTED" ~/.ssh/id_rsa || echo "Key is not encrypted"

          # Try with explicit key and BatchMode
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa -v labgrid@ecogrid "echo SSH connection successful"
          echo "=== SSH directory contents ==="
          ls -la ~/.ssh/
          echo "=== Known hosts ==="
          cat ~/.ssh/known_hosts
          echo "=== Testing SSH connection ==="
          ssh -v labgrid@ecogrid "echo SSH connection successful"

      - name: clone boardgarden
        working-directory: /home/labgrid
        run: |
          git clone https://forgejo.oryx-coho.ts.net/tgamblin/boardgarden.git

      - name: install uv
        working-directory: /home/labgrid
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: run uv sync
        working-directory: /home/labgrid/boardgarden
        run: |
          cd boards
          uv sync

      - name: Fetch latest rootfs
        if: matrix.machine == 'bananapi-f3'
        working-directory: /home/labgrid
        run: |
          BOARD="${RISCV_MACHINE%-mainline}"
          LATEST_WIC=$(ssh -i ~/.ssh/id_rsa_tftp -o StrictHostKeyChecking=no \
            ${TFTP_USER}@${TFTP_SERVER} "readlink /srv/tftp/${BOARD}/${BOARD}.rootfs-latest.wic.gz")
          LATEST_BMAP=$(ssh -i ~/.ssh/id_rsa_tftp -o StrictHostKeyChecking=no \
            ${TFTP_USER}@${TFTP_SERVER} "readlink /srv/tftp/${BOARD}/${BOARD}.rootfs-latest.wic.bmap")
          rsync -avz -e "ssh -i ~/.ssh/id_rsa_tftp -o StrictHostKeyChecking=no" \
            ${TFTP_USER}@${TFTP_SERVER}:/srv/tftp/${BOARD}/${LATEST_WIC} .
          rsync -avz -e "ssh -i ~/.ssh/id_rsa_tftp -o StrictHostKeyChecking=no" \
            ${TFTP_USER}@${TFTP_SERVER}:/srv/tftp/${BOARD}/${LATEST_BMAP} .
          ln -sf ${LATEST_WIC} ${BOARD}.rootfs-latest.wic.gz
          ln -sf ${LATEST_BMAP} ${BOARD}.rootfs-latest.wic.bmap

      - name: run labgrid-client
        working-directory: /home/labgrid/boardgarden/boards
        run: |
          eval `uv run labgrid-client reserve --shell machine=$RISCV_MACHINE`
          BOARD="${RISCV_MACHINE%-mainline}"
          LG_PLACE="bf-${BOARD}"
          echo $LG_PLACE
          echo $LG_TOKEN
          uv run labgrid-client wait
          uv run labgrid-client -p + lock
          uv run labgrid-client -p + show
          EXIT_CODE=1
          for ATTEMPT in 1 2 3; do
            echo "Test attempt ${ATTEMPT} of 3"
            if uv run pytest -vv --html=report.html --self-contained-html $BOARD/pytest; then
              echo "Tests passed on attempt ${ATTEMPT}. Releasing reservation"
              EXIT_CODE=0
              break
            else
              echo "Attempt ${ATTEMPT} failed"
            fi
          done
          if [ $EXIT_CODE -ne 0 ]; then
            echo "All 3 pytest attempts failed"
          fi
          uv run labgrid-client -p + -c $BOARD/client.yaml pw off
          uv run labgrid-client -p + release
          exit $EXIT_CODE

      - name: Setup SSH key
        working-directory: /home/labgrid
        env:
          SSH_KEY: ${{ secrets.REPORT_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" >> ~/.ssh/id_rsa
          ssh-keyscan ecovault >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan 100.72.220.81 >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/id_rsa

      - name: test SSH connection
        working-directory: /home/labgrid
        run: |
          # Check if the key is encrypted
          grep "ENCRYPTED" ~/.ssh/id_rsa || echo "Key is not encrypted"

          # Try with explicit key and BatchMode
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa -v reporter@ecovault "echo SSH connection successful" || true
          echo "=== SSH directory contents ==="
          ls -la ~/.ssh/
          echo "=== Known hosts ==="
          cat ~/.ssh/known_hosts
          echo "=== Testing SSH connection ==="
          ssh -v reporter@ecovault "echo SSH connection successful"

      - name: Deploy report
        run: |
          REPORT_DIR="yocto/meta-riscv/${{ matrix.machine }}/$(date +%Y%m%d)/${{ forgejo.run_id }}"
          ssh -o StrictHostKeyChecking=no reporter@ecovault "mkdir -p /testresults/$REPORT_DIR"
          rsync -av /home/labgrid/boardgarden/boards/report.html reporter@ecovault:/testresults/$REPORT_DIR/
