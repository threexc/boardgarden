name: ffmpeg-bench

# Builds testv-image-ffmpeg-bench (meta-testv) for qemuriscv64 with the testv
# distro once per RISC-V tune (DEFAULTTUNE), optionally also with FFmpeg's
# assembly disabled, then boots each build in random order under the
# k3-pico-itx-8gb's qemu with KVM (-cpu host), after flashing it with
# testv-image-kvm-base as ptest-kvm-compare does, and times FFmpeg decodes,
# encodes and scaling in it (board-tests/test_ffmpeg_bench.py).

on:
  workflow_dispatch:
    inputs:
      tunes:
        description: 'JSON array of DEFAULTTUNEs to build and compare (speed-ups are relative to riscv64gc, or the first)'
        required: true
        default: '["riscv64gc", "rva20u64", "rva22u64", "rva23u64"]'
        type: string
      disable_asm:
        description: 'Also build each tune with FFmpeg --disable-asm, to compare compiler-generated code alone'
        required: true
        default: false
        type: boolean
      iterations:
        description: 'Runs of each benchmark (the median is reported)'
        required: true
        default: '3'
        type: string
      bitbake_setup_override:
        description: 'bitbake-setup source override to apply (none for default)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - oe-core-master-next
          - meta-riscv-tgamblin-dev
          - meta-riscv-tgamblin-fixes
          - meta-riscv-tgamblin-review

defaults:
  run:
    shell: bash

env:
  IMAGE: testv-image-ffmpeg-bench
  HOST_MACHINE: k3-pico-itx
  HOST_IMAGE: testv-image-kvm-base

jobs:
  build:
    runs-on: yocto-build
    strategy:
      fail-fast: false
      matrix:
        tune: ${{ fromJSON(inputs.tunes) }}
        asm: ${{ inputs.disable_asm && fromJSON('["on", "off"]') || fromJSON('["on"]') }}
    container:
      image: ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/yocto-builder:v1
      volumes:
        - /buildcache:/buildcache
      env:
        DL_DIR: "/buildcache/downloads"
        SSTATE_DIR: "/buildcache/sstate-cache"
    steps:
      - uses: actions/checkout@v4
      - id: config
        uses: ./.forgejo/actions/board-yocto-config
        with:
          machine: qemuriscv64
          image: ${{ env.IMAGE }}
          distro: testv
          # The rest comes from meta-testv's ffmpeg-bench fragment.
          extra_local_conf: |
            DEFAULTTUNE = "${{ matrix.tune }}"
            FFMPEG_BENCH_OECONF = "${{ matrix.asm == 'off' && '--disable-asm' || '' }}"
      - id: build
        uses: https://forgejo.baylibre.com/tgamblin/build-yocto-image@main
        with:
          config_json: ${{ steps.config.outputs.config_json }}
          positions: ${{ steps.config.outputs.positions }}
          machine: qemuriscv64
          targets: ${{ steps.config.outputs.targets }}
          fragments: ${{ steps.config.outputs.fragments }} meta-testv/ffmpeg-bench
          local_conf: ${{ steps.config.outputs.local_conf }}
          source_override: ${{ inputs.bitbake_setup_override }}
          overrides_dir: .forgejo/bitbake-configs
      - uses: ./.forgejo/actions/stage-qemu-images
        with:
          image: ${{ env.IMAGE }}
          artifact: ffmpeg-bench-${{ matrix.tune }}${{ matrix.asm == 'off' && '-noasm' || '' }}
          machine: qemuriscv64
          images_path: ${{ steps.build.outputs.images_path }}

  # As in ptest-kvm-compare.
  build-host:
    runs-on: yocto-build
    container:
      image: ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/yocto-builder:v1
      volumes:
        - /buildcache:/buildcache
      env:
        DL_DIR: "/buildcache/downloads"
        SSTATE_DIR: "/buildcache/sstate-cache"
    steps:
      - uses: actions/checkout@v4
      - id: config
        uses: ./.forgejo/actions/board-yocto-config
        with:
          machine: ${{ env.HOST_MACHINE }}
          image: ${{ env.HOST_IMAGE }}
          distro: testv
      - id: build
        uses: https://forgejo.baylibre.com/tgamblin/build-yocto-image@main
        with:
          config_json: ${{ steps.config.outputs.config_json }}
          positions: ${{ steps.config.outputs.positions }}
          machine: ${{ env.HOST_MACHINE }}
          targets: ${{ steps.config.outputs.targets }}
          fragments: ${{ steps.config.outputs.fragments }}
          local_conf: ${{ steps.config.outputs.local_conf }}
          source_override: ${{ inputs.bitbake_setup_override }}
          overrides_dir: .forgejo/bitbake-configs
      # The files boards/k3-pico-itx-8gb/board.yaml flashes, named as there.
      - name: stage fastboot images
        env:
          IMAGES_PATH: ${{ steps.build.outputs.images_path }}
        run: |
          set -euo pipefail
          SRC="${IMAGES_PATH}/${HOST_MACHINE}"
          STAGE="$GITHUB_WORKSPACE/host-images"
          mkdir -p "${STAGE}"
          for f in FSBL.bin u-boot.itb bootinfo_spinor.bin u-boot-env-default.bin esos.itb fw_dynamic.itb bootfs.ext4; do
            if [ -e "${SRC}/${f}" ]; then cp -L "${SRC}/${f}" "${STAGE}/"; fi
          done
          cp -L "${SRC}/${HOST_IMAGE}-${HOST_MACHINE}.rootfs.ext4" "${STAGE}/rootfs.ext4"
          ls -l "${STAGE}"
      - uses: actions/upload-artifact@v3
        with:
          name: kvm-host-image
          path: ${{ github.workspace }}/host-images

  bench:
    needs: [build, build-host]
    # Benchmark whatever did build, as long as there's somewhere to run it.
    if: ${{ !cancelled() && needs.build-host.result == 'success' }}
    runs-on: board-test
    container:
      image: ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/lg-operator:v1
      options: --add-host ${{ vars.TFTP_SERVER_HOST }}:${{ vars.TFTP_SERVER_IP }}
      env:
        LG_COORDINATOR: ${{ vars.LG_COORDINATOR_HOST }}
        LG_PROXY: ${{ vars.TFTP_SERVER_HOST }}
    steps:
      - uses: actions/checkout@v4

      # Without a name, each artifact lands in its own
      # images/<artifact>/ subdir.
      - uses: actions/download-artifact@v3
        with:
          path: /home/labgrid/images

      - uses: ./.forgejo/actions/k3-kvm-host
        with:
          host_images: /home/labgrid/images/kvm-host-image
          lg_exporter_ssh_key: ${{ secrets.LG_EXPORTER_SSH_KEY }}
          ssh_known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      # Slow or failed benchmarks show up in the summary; don't fail the job
      # over them.
      - name: run benchmarks
        continue-on-error: true
        env:
          BENCH_ITERATIONS: ${{ inputs.iterations }}
        run: boards/k3-pico-itx-8gb/run-qemu-ffmpeg-bench.sh

      - name: power off and release board
        if: ${{ always() && env.LG_TOKEN != '' }}
        run: |
          uv run labgrid-client -p "+" -c boards/k3-pico-itx-8gb/client.yaml pw off || true
          uv run labgrid-client -p "+" release || true
          uv run labgrid-client cancel-reservation || true

      # With meta-testv's report, as for its ffmpeg_bench testimage runs.
      - name: summarize results
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p logs
          curl -fsSL -o ffmpeg-bench-report \
            https://forgejo.baylibre.com/tgamblin/meta-testv/raw/branch/main/scripts/ffmpeg-bench-report
          {
            echo "## FFmpeg benchmarks (k3-pico-itx-8gb, KVM)"
            echo
            python3 ffmpeg-bench-report logs/*/bench.json
            echo
            echo "Run order: $(paste -sd' ' logs/order.txt 2>/dev/null || true)"
          } | tee logs/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v3
        with:
          name: ffmpeg-bench-logs
          path: logs/
