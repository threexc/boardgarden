name: nightly-build-and-test

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      bitbake_setup_override:
        description: 'bitbake-setup source override to apply (none for default)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - meta-riscv-tgamblin-k1-fixes
          - meta-riscv-tgamblin-k3-fixes
      image:
        description: 'Image to build'
        required: true
        default: 'core-image-minimal'
        type: choice
        options:
          - core-image-minimal
          - core-image-full-cmdline
          - core-image-ptest-python3
      machines:
        description: 'JSON array of machines, or "auto"'
        required: true
        default: 'auto'
        type: string

env:
  TFTP_SERVER: ${{ vars.TFTP_SERVER_HOST }}
  TFTP_USER: "auto"

jobs:
  discover:
    runs-on: tgamblin-maintenance
    outputs:
      matrix: ${{ steps.disc.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: disc
        uses: ./.forgejo/actions/discover-machines

  build:
    needs: discover
    runs-on: tgamblin-build
    strategy:
      matrix:
        machine: >-
          ${{
            inputs.machines != '' && inputs.machines != 'auto'
              && fromJSON(inputs.machines)
              || fromJSON(needs.discover.outputs.matrix)
          }}
    container:
      image: ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/yocto-builder
      options: --add-host ${{ vars.TFTP_SERVER_HOST }}:${{ vars.TFTP_SERVER_IP }}
      volumes:
        - /auto/runner/buildcache:/buildcache
      env:
        DL_DIR: "/buildcache/downloads"
        SSTATE_DIR: "/buildcache/sstate-cache"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/build-yocto-image
        with:
          machine: ${{ matrix.machine }}
          image: ${{ inputs.image || 'core-image-minimal' }}
          bitbake_setup_override: ${{ inputs.bitbake_setup_override || 'none' }}
          ssh_private_key: ${{ secrets.TFTP_SERVER_SSH_KEY }}
          ssh_known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          tftp_server: ${{ env.TFTP_SERVER }}
          tftp_user: ${{ env.TFTP_USER }}
          boardgarden_owner: ${{ vars.BOARDGARDEN_OWNER }}

  test:
    needs: [discover, build]
    runs-on: tgamblin-board-test
    strategy:
      matrix:
        machine: >-
          ${{
            inputs.machines != '' && inputs.machines != 'auto'
              && fromJSON(inputs.machines)
              || fromJSON(needs.discover.outputs.matrix)
          }}
    container:
      image: ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/lg-operator
      options: --add-host ${{ vars.LG_COORDINATOR_HOST }}:${{ vars.LG_COORDINATOR_IP }} --add-host ${{ vars.TFTP_SERVER_HOST }}:${{ vars.TFTP_SERVER_IP }}
      env:
        LG_COORDINATOR: ${{ vars.LG_COORDINATOR_HOST }}
        VERSION: 7.0
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/run-board-tests
        with:
          machine: ${{ matrix.machine }}
          image: ${{ inputs.image || 'core-image-minimal' }}
          lg_exporter_ssh_key: ${{ secrets.LG_EXPORTER_SSH_KEY }}
          tftp_server_ssh_key: ${{ secrets.TFTP_SERVER_SSH_KEY }}
          report_ssh_key: ${{ secrets.REPORT_SSH_KEY }}
          ssh_known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          tftp_server: ${{ env.TFTP_SERVER }}
          tftp_user: ${{ env.TFTP_USER }}
          lg_coordinator: ${{ vars.LG_COORDINATOR_HOST }}
          boardgarden_owner: ${{ vars.BOARDGARDEN_OWNER }}
