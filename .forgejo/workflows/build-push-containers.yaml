name: Build and Push Container Images
on:
  push:
    paths:
      - '.forgejo/dockerfiles/**'
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:

jobs:
  build-container-images:
    name: Build and push ${{ matrix.name }}
    runs-on: tgamblin-maintenance
    container:
      image: ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/container-builder
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: yocto-builder
            dockerfile: ./.forgejo/dockerfiles/yocto-builder/Dockerfile
          - name: container-builder
            dockerfile: ./.forgejo/dockerfiles/container-builder/Dockerfile
          - name: lg-operator
            dockerfile: ./.forgejo/dockerfiles/labgrid-operator/Dockerfile
          - name: kernel-builder
            dockerfile: ./.forgejo/dockerfiles/kernel-builder/Dockerfile

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Docker CLI
      run: |
        apt-get update
        apt-get install -y ca-certificates curl gnupg
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
        apt-get update
        apt-get install -y docker-ce-cli

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          network=host
        buildkitd-config-inline: |
          [registry."${{ vars.BOARDGARDEN_HOST }}"]
            ca=["/etc/ssl/certs/ca-certificates.crt"]

    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ vars.BOARDGARDEN_HOST }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Build and push ${{ matrix.name }}
      uses: docker/build-push-action@v5
      with:
        context: ./.forgejo/dockerfiles
        file: ${{ matrix.dockerfile }}
        push: true
        platforms: linux/amd64
        tags: |
          ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/${{ matrix.name }}:latest
