name: Build and Push Container Images
on:
  push:
    paths:
      - '.forgejo/dockerfiles/**'
  schedule:
    - cron: '45 1 * * 0'
  workflow_dispatch:

jobs:
  build-container-images:
    name: Build and push ${{ matrix.name }}
    runs-on: light-maintenance
    container:
      image: ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/container-builder:v1
    strategy:
      fail-fast: false
      # Workflows pin these images by literal tag (zizmor unpinned-images).
      # When an image changes incompatibly, bump its tag here and in every
      # workflow that uses it, in the same commit.
      matrix:
        include:
          - name: yocto-builder
            dockerfile: ./.forgejo/dockerfiles/yocto-builder/Dockerfile
            tag: v1
          - name: container-builder
            dockerfile: ./.forgejo/dockerfiles/container-builder/Dockerfile
            tag: v1
          - name: lg-operator
            dockerfile: ./.forgejo/dockerfiles/labgrid-operator/Dockerfile
            tag: v1
          - name: kernel-builder
            dockerfile: ./.forgejo/dockerfiles/kernel-builder/Dockerfile
            tag: v1
          - name: qemu-builder
            dockerfile: ./.forgejo/dockerfiles/qemu-builder/Dockerfile
            tag: v1

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Docker CLI
      run: |
        # Baked into container-builder; fall back for an older image
        command -v docker && exit 0
        apt-get update
        apt-get install -y ca-certificates curl gnupg
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
        apt-get update
        apt-get install -y docker-ce-cli

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          network=host
        buildkitd-config-inline: |
          [registry."${{ vars.BOARDGARDEN_HOST }}"]
            ca=["/etc/ssl/certs/ca-certificates.crt"]

    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ vars.BOARDGARDEN_HOST }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Build and push ${{ matrix.name }}
      uses: docker/build-push-action@v5
      with:
        context: ./.forgejo/dockerfiles
        file: ${{ matrix.dockerfile }}
        push: true
        platforms: linux/amd64
        tags: |
          ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/${{ matrix.name }}:latest
          ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/${{ matrix.name }}:${{ matrix.tag }}
        # Reuse layers across runs; the weekly run rebuilds from scratch to
        # pick up distro updates, then refreshes the cache.
        no-cache: ${{ github.event_name == 'schedule' }}
        cache-from: type=registry,ref=${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/${{ matrix.name }}:buildcache
        cache-to: type=registry,ref=${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/${{ matrix.name }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
