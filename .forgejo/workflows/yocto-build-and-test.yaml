name: yocto-build-and-test

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      bitbake_setup_override:
        description: 'bitbake-setup source override to apply (none for default)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - meta-riscv-tgamblin-review
          - meta-riscv-tgamblin-fixes
      distro:
        description: 'Distro: testv (meta-testv) or nodistro (oe-core)'
        required: true
        default: 'testv'
        type: choice
        options:
          - testv
          - nodistro
      image:
        description: 'Image to build'
        required: true
        default: 'core-image-minimal'
        type: choice
        options:
          - core-image-minimal
          - core-image-full-cmdline
          - core-image-ptest-python3
      initramfs_image:
        description: 'Initramfs image to build for boards using kernel+dtb+initramfs boot'
        required: true
        default: 'core-image-minimal-initramfs'
        type: string
      machines:
        description: 'JSON array of machines, or "auto"'
        required: true
        default: 'auto'
        type: string
      board:
        description: 'Board dir to test on, for machines several boards share (blank for any)'
        required: false
        default: ''
        type: string
      boot_method:
        description: 'Boot method to test with, for boards that have several'
        required: true
        default: 'default'
        type: choice
        options:
          - default
          - fastboot
          - tftp
          - sdmux

env:
  TFTP_SERVER: ${{ vars.TFTP_SERVER_HOST }}
  TFTP_USER: "auto"

jobs:
  discover:
    runs-on: light-maintenance
    outputs:
      matrix: ${{ steps.disc.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: disc
        uses: ./.forgejo/actions/discover-machines

  build:
    needs: discover
    runs-on: yocto-build
    strategy:
      fail-fast: false
      matrix:
        machine: >-
          ${{
            inputs.machines != '' && inputs.machines != 'auto'
              && fromJSON(inputs.machines)
              || fromJSON(needs.discover.outputs.matrix)
          }}
    container:
      image: ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/yocto-builder:v1
      options: --add-host ${{ vars.TFTP_SERVER_HOST }}:${{ vars.TFTP_SERVER_IP }}
      volumes:
        - /auto/runner/buildcache:/buildcache
      env:
        DL_DIR: "/buildcache/downloads"
        SSTATE_DIR: "/buildcache/sstate-cache"
        PERSISTENT_TMPDIR_BASE: "/buildcache/tmp"
    steps:
      - uses: actions/checkout@v4
      - id: build
        uses: ./.forgejo/actions/build-yocto-image
        with:
          machine: ${{ matrix.machine }}
          image: ${{ inputs.image || 'core-image-minimal' }}
          initramfs_image: ${{ inputs.initramfs_image || 'core-image-minimal-initramfs' }}
          bitbake_setup_override: ${{ inputs.bitbake_setup_override || 'none' }}
          distro: ${{ inputs.distro || 'testv' }}
      - uses: ./.forgejo/actions/deploy-to-tftp
        with:
          ssh_known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          ssh_private_key: ${{ secrets.TFTP_SERVER_SSH_KEY }}
          tftp_server: ${{ env.TFTP_SERVER }}
          tftp_user: ${{ env.TFTP_USER }}
          board: ${{ steps.build.outputs.board }}
          machine: ${{ matrix.machine }}
          image: ${{ inputs.image || 'core-image-minimal' }}
          images_path: ${{ steps.build.outputs.images_path }}
          deploy_wic: ${{ steps.build.outputs.deploy_wic }}
          deploy_fastboot: ${{ steps.build.outputs.deploy_fastboot }}
      # Marks this specific matrix entry as a successful build and records the
      # kernel version it produced, only if the build succeeded. Matrix job
      # outputs can't be aggregated directly, but artifacts can.
      - name: record build success and kernel version
        run: echo "${{ steps.build.outputs.kernel_version }}" > /tmp/build-ok
      - uses: actions/upload-artifact@v3
        with:
          name: built-machine-${{ matrix.machine }}
          path: /tmp/build-ok

  collect_built_machines:
    needs: [discover, build]
    # Run under any scenario other than builds being cancelled
    if: ${{ !cancelled() }}
    runs-on: light-maintenance
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
      versions: ${{ steps.collect.outputs.versions }}
    steps:
      - uses: actions/download-artifact@v3
        with:
          path: built-machines
      - id: collect
        run: |
          set -euo pipefail
          MACHINES=""
          VERSIONS="{"
          FIRST=1
          for d in built-machines/built-machine-*/; do
            [ -d "$d" ] || continue
            m=$(basename "$d" | sed 's/^built-machine-//')
            v=$(cat "${d}build-ok")
            if [ "$FIRST" -eq 1 ]; then
              FIRST=0
            else
              MACHINES="${MACHINES},"
              VERSIONS="${VERSIONS},"
            fi
            MACHINES="${MACHINES}\"${m}\""
            VERSIONS="${VERSIONS}\"${m}\":\"${v}\""
          done
          MATRIX="[${MACHINES}]"
          VERSIONS="${VERSIONS}}"
          echo "matrix=$MATRIX"
          echo "versions=$VERSIONS"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"

  test:
    needs: [discover, collect_built_machines]
    runs-on: board-test
    strategy:
      matrix:
        machine: ${{ fromJSON(needs.collect_built_machines.outputs.matrix) }}
    container:
      image: ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/lg-operator:v1
      options: --add-host ${{ vars.TFTP_SERVER_HOST }}:${{ vars.TFTP_SERVER_IP }}
      env:
        LG_COORDINATOR: ${{ vars.LG_COORDINATOR_HOST }}
        LG_PROXY: ${{ vars.TFTP_SERVER_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/run-board-tests
        with:
          machine: ${{ matrix.machine }}
          kernel_version: ${{ fromJSON(needs.collect_built_machines.outputs.versions)[matrix.machine] }}
          board: ${{ inputs.board || '' }}
          boot_method: ${{ inputs.boot_method != 'default' && inputs.boot_method || '' }}
          lg_exporter_ssh_key: ${{ secrets.LG_EXPORTER_SSH_KEY }}
          tftp_server_ssh_key: ${{ secrets.TFTP_SERVER_SSH_KEY }}
          report_ssh_key: ${{ secrets.REPORT_SSH_KEY }}
          ssh_known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          tftp_server: ${{ env.TFTP_SERVER }}
          tftp_user: ${{ env.TFTP_USER }}
          lg_coordinator: ${{ vars.LG_COORDINATOR_HOST }}
