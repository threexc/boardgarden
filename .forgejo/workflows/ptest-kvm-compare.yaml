name: ptest-kvm-compare

# Builds testv-image-kvm-test (meta-testv: core-image-full-cmdline plus qemu
# and room for a ptest image) for the k3-pico-itx-8gb, then qemuriscv64 ptest
# images. Flashes the host image to the board over fastboot, then boots each
# ptest image, in random order, under the board's qemu-system-riscv64 with
# KVM, and optionally again with TCG to compare how long ptest-runner takes.

on:
  workflow_dispatch:
    inputs:
      bitbake_setup_override:
        description: 'bitbake-setup source override to apply (none for default)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - oe-core-master-next
      packages:
        description: 'JSON array of ptest recipes'
        required: true
        default: '["bzip2", "coreutils", "parted", "xz"]'
        type: string
      tcg:
        description: 'Also run each ptest under TCG for comparison (slow)'
        required: true
        default: false
        type: boolean
      tcg_cpu:
        description: 'Guest -cpu for the TCG runs, if enabled (KVM always uses host)'
        required: true
        default: 'max'
        type: string
      smp:
        description: 'Guest vCPUs, same for both runs'
        required: true
        default: '4'
        type: string
      memory:
        description: 'Guest memory in MiB, same for both runs'
        required: true
        default: '4096'
        type: string
      ptest_timeout:
        description: 'Seconds to wait for each ptest-runner run'
        required: true
        default: '14400'
        type: string
      ptest_runner_timeout:
        description: 'ptest-runner -t: seconds a ptest may go without output before it is killed (same for both runs)'
        required: true
        default: '3600'
        type: string

defaults:
  run:
    shell: bash

env:
  HOST_MACHINE: k3-pico-itx
  HOST_IMAGE: testv-image-kvm-test

jobs:
  build-host:
    runs-on: tgamblin-build
    container:
      image: ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/yocto-builder
      volumes:
        - /auto/runner/buildcache:/buildcache
      env:
        DL_DIR: "/buildcache/downloads"
        SSTATE_DIR: "/buildcache/sstate-cache"
    steps:
      - uses: actions/checkout@v4
      - id: build
        uses: ./.forgejo/actions/build-yocto-image
        with:
          machine: ${{ env.HOST_MACHINE }}
          image: ${{ env.HOST_IMAGE }}
          config_json: .forgejo/bitbake-configs/meta-riscv-testv-master.conf.json
          configuration: testv
          setup_dir: testv-master-meta-riscv
          bitbake_setup_override: ${{ inputs.bitbake_setup_override }}
          boardgarden_owner: ${{ vars.BOARDGARDEN_OWNER }}

      # The files boards/k3-pico-itx-8gb/board.yaml flashes, named as there
      # (as deploy-tftp-artifacts does for the nightly).
      - name: stage fastboot images
        env:
          IMAGES_PATH: ${{ steps.build.outputs.images_path }}
        run: |
          set -euo pipefail
          SRC="${IMAGES_PATH}/${HOST_MACHINE}"
          STAGE="$GITHUB_WORKSPACE/host-images"
          mkdir -p "${STAGE}"
          cp -L "${SRC}"/{FSBL.bin,u-boot.itb,bootinfo_spinor.bin,u-boot-env-default.bin,esos.itb,fw_dynamic.itb,bootfs.ext4} "${STAGE}/"
          cp -L "${SRC}/${HOST_IMAGE}-${HOST_MACHINE}.rootfs.ext4" "${STAGE}/rootfs.ext4"
          ls -l "${STAGE}"

      - uses: actions/upload-artifact@v3
        with:
          name: kvm-host-image
          path: ${{ github.workspace }}/host-images

  build:
    needs: build-host
    runs-on: tgamblin-build
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    container:
      image: ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/yocto-builder
      volumes:
        - /auto/runner/buildcache:/buildcache
      env:
        DL_DIR: "/buildcache/downloads"
        SSTATE_DIR: "/buildcache/sstate-cache"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/build-ptest-image
        with:
          package: ${{ matrix.package }}
          config_json: ./.forgejo/bitbake-configs/poky-master-dl-sstate-passthrough.conf.json
          source_override: ${{ inputs.bitbake_setup_override }}
          repo_owner: ${{ vars.BOARDGARDEN_OWNER }}

  compare:
    needs: [build-host, build]
    # Compare whatever did build, even if some packages failed - but there's
    # nothing to run them on without the host image.
    if: ${{ !cancelled() && needs.build-host.result == 'success' }}
    runs-on: tgamblin-board-test
    container:
      image: ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/lg-operator
      options: --add-host ${{ vars.TFTP_SERVER_HOST }}:${{ vars.TFTP_SERVER_IP }}
      env:
        LG_COORDINATOR: ${{ vars.LG_COORDINATOR_HOST }}
        LG_PROXY: ${{ vars.TFTP_SERVER_HOST }}
    env:
      PLACE: tg-k3-pitx-8gb
      # On the rootfs (where the image's extra space is), not tmpfs /var/tmp.
      BOARD_DIR: /home/root/ptest-kvm-compare
    steps:
      - uses: actions/checkout@v4

      - name: set up keys
        env:
          LG_EXPORTER_SSH_KEY: ${{ secrets.LG_EXPORTER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$LG_EXPORTER_SSH_KEY" > ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host *
              StrictHostKeyChecking accept-new
          EOF

      # Without a name, each artifact lands in its own
      # images/<artifact>/ subdir.
      - uses: actions/download-artifact@v3
        with:
          path: /home/labgrid/images

      - name: install uv
        uses: astral-sh/setup-uv@v5
        env:
          # /opt/hostedtoolcache is a runner-mounted volume owned by root,
          # not the image's chown'd copy - redirect to a path labgrid owns.
          RUNNER_TOOL_CACHE: /home/labgrid/hostedtoolcache
        with:
          working-directory: ${{ github.workspace }}
          enable-cache: true

      - name: reserve board
        run: |
          set -euo pipefail
          uv sync
          eval "$(uv run labgrid-client reserve --shell "name=${PLACE}")"
          echo "LG_TOKEN=${LG_TOKEN}" >> "$GITHUB_ENV"
          uv run labgrid-client wait
          uv run labgrid-client -p "+" lock

      # Same fastboot flash as the nightly's tests (K3PicoItxBootStrategy),
      # then the board's address from its serial console for ssh.
      - name: flash and boot testv-image-kvm-test
        run: |
          set -euo pipefail
          IMAGE_DIR=/home/labgrid/k3-pico-itx-fastboot
          mv /home/labgrid/images/kvm-host-image "${IMAGE_DIR}"
          # Partition layouts aren't build output; they live in the board dir.
          cp boards/k3-pico-itx-8gb/*.json "${IMAGE_DIR}/"
          uv run python - <<'EOF'
          import time
          from labgrid import Environment

          target = Environment("boards/k3-pico-itx-8gb/client.yaml").get_target()
          target.get_driver("Strategy").transition("shell")
          shell = target.get_driver("ShellDriver")
          for _ in range(30):
              out, _, _ = shell.run("ip -4 -o addr show scope global")
              addrs = [l.split()[3].split("/")[0] for l in out if " inet " in l]
              if addrs:
                  break
              time.sleep(5)
          else:
              raise SystemExit("board got no IPv4 address")
          with open("/tmp/board-ip", "w") as f:
              f.write(addrs[0])
          EOF
          # The image allows root login with an empty password; its host key
          # is new on every flash.
          cat >> ~/.ssh/config <<EOF
          Host ptest-board
              HostName $(cat /tmp/board-ip)
              User root
              UserKnownHostsFile /dev/null
              StrictHostKeyChecking no
              LogLevel ERROR
              ConnectTimeout 10
          EOF
          for _ in $(seq 30); do
            ssh ptest-board true 2>/dev/null && break
            sleep 10
          done
          ssh ptest-board 'uname -a; qemu-system-riscv64 --version; ls -l /dev/kvm || true; df -h /'

      - name: run ptests
        id: ptests
        env:
          TCG: ${{ inputs.tcg }}
          TCG_CPU: ${{ inputs.tcg_cpu }}
          LG_QEMU_SMP: ${{ inputs.smp }}
          LG_QEMU_MEMORY: ${{ inputs.memory }}
          PTEST_TIMEOUT: ${{ inputs.ptest_timeout }}
          PTEST_RUNNER_TIMEOUT: ${{ inputs.ptest_runner_timeout }}
        run: boards/k3-pico-itx-8gb/run-qemu-ptests.sh

      - name: power off and release board
        if: ${{ always() && env.LG_TOKEN != '' }}
        run: |
          uv run labgrid-client -p "+" -c boards/k3-pico-itx-8gb/client.yaml pw off || true
          uv run labgrid-client -p "+" release || true
          uv run labgrid-client cancel-reservation || true

      - name: summarize durations and results
        if: ${{ !cancelled() }}
        run: |
          mkdir -p logs
          touch logs/order.txt
          python3 - <<'EOF' | tee logs/summary.md >> "$GITHUB_STEP_SUMMARY"
          import pathlib, re, xml.etree.ElementTree as ET

          logs = pathlib.Path("logs")
          order = logs.joinpath("order.txt").read_text().split()
          modes = ["kvm"] + (["tcg"] if any((logs / p / "tcg").is_dir() for p in order) else [])

          def times(junit):
              if not junit.is_file():
                  return {}
              return {
                  tc.get("name"): (float(tc.get("time")), not len(tc))
                  for tc in ET.parse(junit).iter("testcase")
              }

          def counts(console):
              c = {"PASS": 0, "FAIL": 0, "SKIP": 0}
              if console.is_file():
                  for line in console.read_text(errors="replace").splitlines():
                      if m := re.match(r"(PASS|FAIL|SKIP): ", line.strip()):
                          c[m[1]] += 1
              return "/".join(str(v) for v in c.values())

          head = ["#", "package"]
          for m in modes:
              M = m.upper()
              head += [f"boot {M} (s)", f"ptest {M} (s)", f"{M} pass/fail/skip"]
          if "tcg" in modes:
              head.append("TCG/KVM")
          print("| " + " | ".join(head) + " |")
          print("|" + "---|" * len(head))

          for i, pkg in enumerate(order, 1):
              row = [str(i), pkg]
              if (logs / pkg / "stage-failed").exists():
                  print("| " + " | ".join(row + ["staging failed"] + [""] * (len(head) - 3)) + " |")
                  continue
              t = {m: times(logs / pkg / m / "junit.xml") for m in modes}

              def cell(m, test):
                  if test not in t[m]:
                      return "-"
                  secs, ok = t[m][test]
                  return f"{secs:.0f}" + ("" if ok else " (fail)")

              for m in modes:
                  row += [cell(m, "test_system_booted"), cell(m, "test_ptests"),
                          counts(logs / pkg / m / "console_main")]
              if "tcg" in modes:
                  k = t["kvm"].get("test_ptests", (0,))[0]
                  g = t["tcg"].get("test_ptests", (0,))[0]
                  row.append(f"{g / k:.1f}x" if k and g else "-")
              print("| " + " | ".join(row) + " |")
          EOF

      - name: upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v3
        with:
          name: ptest-kvm-compare-logs
          path: logs/
