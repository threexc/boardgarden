name: ptest-kvm-compare

# Builds qemuriscv64 ptest images, then boots each one under the
# k3-pico-itx-8gb's own qemu-system-riscv64 (eMMC OS) twice - once with KVM,
# once with TCG - and compares how long ptest-runner takes.

on:
  workflow_dispatch:
    inputs:
      bitbake_setup_override:
        description: 'bitbake-setup source override to apply (none for default)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - oe-core-master-next
      packages:
        description: 'JSON array of ptest recipes'
        required: true
        default: '["bzip2", "coreutils", "parted", "xz"]'
        type: string
      tcg_cpu:
        description: 'Guest -cpu for the TCG runs (KVM always uses host)'
        required: true
        default: 'max'
        type: string
      smp:
        description: 'Guest vCPUs, same for both runs'
        required: true
        default: '4'
        type: string
      memory:
        description: 'Guest memory in MiB, same for both runs'
        required: true
        default: '4096'
        type: string
      ptest_timeout:
        description: 'Seconds to wait for each ptest-runner run'
        required: true
        default: '14400'
        type: string
      ptest_runner_timeout:
        description: 'ptest-runner -t: seconds a ptest may go without output before it is killed (same for both runs)'
        required: true
        default: '3600'
        type: string

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: tgamblin-build
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    container:
      image: ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/yocto-builder
      volumes:
        - /auto/runner/buildcache:/buildcache
      env:
        DL_DIR: "/buildcache/downloads"
        SSTATE_DIR: "/buildcache/sstate-cache"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/build-ptest-image
        with:
          package: ${{ matrix.package }}
          config_json: ./.forgejo/bitbake-configs/poky-master-dl-sstate-passthrough.conf.json
          source_override: ${{ inputs.bitbake_setup_override }}
          repo_owner: ${{ vars.BOARDGARDEN_OWNER }}

  compare:
    needs: build
    # Compare whatever did build, even if some packages failed.
    if: ${{ !cancelled() }}
    runs-on: tgamblin-board-test
    container:
      image: ${{ vars.BOARDGARDEN_HOST }}/${{ vars.BOARDGARDEN_OWNER }}/lg-operator
      options: --add-host ${{ vars.LG_COORDINATOR_HOST }}:${{ vars.LG_COORDINATOR_IP }}
      env:
        LG_COORDINATOR: ${{ vars.LG_COORDINATOR_HOST }}
    env:
      PLACE: tg-k3-pitx-8gb
      BOARD_DIR: /var/tmp/ptest-kvm-compare
    steps:
      - uses: actions/checkout@v4

      - name: set up keys
        env:
          LG_EXPORTER_SSH_KEY: ${{ secrets.LG_EXPORTER_SSH_KEY }}
          PTEST_BOARD_SSH_KEY: ${{ secrets.PTEST_BOARD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          PTEST_BOARD_HOST: ${{ vars.PTEST_BOARD_HOST }}
          PTEST_BOARD_USER: ${{ vars.PTEST_BOARD_USER }}
        run: |
          set -euo pipefail
          # An empty HostName makes ssh reject the whole config, breaking
          # labgrid's own ssh to the exporter too - fail clearly instead.
          if [ -z "${PTEST_BOARD_HOST}" ]; then
            echo "::error::repo variable PTEST_BOARD_HOST is not set"
            exit 1
          fi
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$LG_EXPORTER_SSH_KEY" > ~/.ssh/id_rsa
          printf '%s\n' "$PTEST_BOARD_SSH_KEY" > ~/.ssh/id_rsa_board
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          # The board's eMMC OS may be reflashed (new host key), so it gets
          # its own known_hosts instead of SSH_KNOWN_HOSTS.
          cat > ~/.ssh/config <<EOF
          Host ptest-board
              HostName ${PTEST_BOARD_HOST}
              User ${PTEST_BOARD_USER:-admin}
              IdentityFile ~/.ssh/id_rsa_board
              UserKnownHostsFile ~/.ssh/known_hosts_board
              StrictHostKeyChecking accept-new
              ConnectTimeout 10
          Host *
              StrictHostKeyChecking accept-new
          EOF

      # Without a name, each artifact lands in its own
      # images/ptest_image_<package>/ subdir.
      - uses: actions/download-artifact@v3
        with:
          path: /home/labgrid/images

      - name: install uv
        uses: astral-sh/setup-uv@v5
        env:
          # /opt/hostedtoolcache is a runner-mounted volume owned by root,
          # not the image's chown'd copy - redirect to a path labgrid owns.
          RUNNER_TOOL_CACHE: /home/labgrid/hostedtoolcache
        with:
          working-directory: ${{ github.workspace }}
          enable-cache: true

      # U-Boot's default autoboot is the eMMC OS, which has the qemu we want.
      - name: reserve board and boot eMMC OS
        run: |
          set -euo pipefail
          uv sync
          eval "$(uv run labgrid-client reserve --shell "name=${PLACE}")"
          echo "LG_TOKEN=${LG_TOKEN}" >> "$GITHUB_ENV"
          uv run labgrid-client wait
          uv run labgrid-client -p "+" lock
          uv run labgrid-client -p "+" -c boards/k3-pico-itx-8gb/client.yaml pw cycle
          for _ in $(seq 60); do
            ssh ptest-board true 2>/dev/null && break
            sleep 10
          done
          ssh ptest-board 'uname -a; qemu-system-riscv64 --version; ls -l /dev/kvm || true'

      - name: stage images on board
        id: stage
        run: |
          set -euo pipefail
          ssh ptest-board "rm -rf ${BOARD_DIR}"
          for d in /home/labgrid/images/ptest_image_*/; do
            [ -d "$d" ] || continue
            pkg=$(basename "$d" | sed 's/^ptest_image_//')
            ssh ptest-board "mkdir -p ${BOARD_DIR}/${pkg}"
            scp -q "$d"/* "ptest-board:${BOARD_DIR}/${pkg}/"
          done

      # Separate steps so each mode gets its own status and log; TCG still
      # runs if KVM fails.
      - name: run ptests (KVM)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        env:
          LG_QEMU_SMP: ${{ inputs.smp }}
          LG_QEMU_MEMORY: ${{ inputs.memory }}
          PTEST_TIMEOUT: ${{ inputs.ptest_timeout }}
          PTEST_RUNNER_TIMEOUT: ${{ inputs.ptest_runner_timeout }}
        run: boards/k3-pico-itx-8gb/run-qemu-ptests.sh kvm

      - name: run ptests (TCG)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        env:
          TCG_CPU: ${{ inputs.tcg_cpu }}
          LG_QEMU_SMP: ${{ inputs.smp }}
          LG_QEMU_MEMORY: ${{ inputs.memory }}
          PTEST_TIMEOUT: ${{ inputs.ptest_timeout }}
          PTEST_RUNNER_TIMEOUT: ${{ inputs.ptest_runner_timeout }}
        run: boards/k3-pico-itx-8gb/run-qemu-ptests.sh tcg

      - name: power off and release board
        if: ${{ always() && env.LG_TOKEN != '' }}
        run: |
          uv run labgrid-client -p "+" -c boards/k3-pico-itx-8gb/client.yaml pw off || true
          uv run labgrid-client -p "+" release || true
          uv run labgrid-client cancel-reservation || true

      - name: summarize durations
        if: ${{ !cancelled() }}
        run: |
          mkdir -p logs
          python3 - <<'EOF' | tee logs/summary.md >> "$GITHUB_STEP_SUMMARY"
          import pathlib, xml.etree.ElementTree as ET

          def times(junit):
              if not junit.is_file():
                  return {}
              return {
                  tc.get("name"): (float(tc.get("time")), not len(tc))
                  for tc in ET.parse(junit).iter("testcase")
              }

          print("| package | boot KVM (s) | boot TCG (s) | ptest KVM (s) | ptest TCG (s) | TCG/KVM |")
          print("|---|---|---|---|---|---|")
          for pkg in sorted(p for p in pathlib.Path("logs").iterdir() if p.is_dir()):
              t = {m: times(pkg / m / "junit.xml") for m in ("kvm", "tcg")}

              def cell(m, test):
                  if test not in t[m]:
                      return "-"
                  secs, ok = t[m][test]
                  return f"{secs:.0f}" + ("" if ok else " (fail)")

              k = t["kvm"].get("test_ptests", (0,))[0]
              g = t["tcg"].get("test_ptests", (0,))[0]
              ratio = f"{g / k:.1f}x" if k and g else "-"
              print(
                  f"| {pkg.name} | {cell('kvm', 'test_system_booted')} | {cell('tcg', 'test_system_booted')} "
                  f"| {cell('kvm', 'test_ptests')} | {cell('tcg', 'test_ptests')} | {ratio} |"
              )
          EOF

      - name: upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v3
        with:
          name: ptest-kvm-compare-logs
          path: logs/

