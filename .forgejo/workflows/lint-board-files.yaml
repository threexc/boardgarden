on:
  push:
    paths:
      - 'boards/**/*.py'
      - 'common/**/*.py'
      - 'tests/**/*.py'
      - 'common/pyproject.toml'
      - 'pyproject.toml'
      - '.pre-commit-config.yaml'
  pull_request:
  workflow_dispatch:

jobs:
  ruff:
    runs-on: tgamblin-maintenance
    container:
      image: ghcr.io/astral-sh/uv:python3.12-bookworm
    steps:
      - name: clone boardgarden at test SHA
        shell: bash
        run: |
          mkdir repo && cd repo
          git init -q
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: ruff check
        working-directory: repo
        run: uvx ruff@0.14 check --no-cache
      - name: ruff format --check
        working-directory: repo
        run: uvx ruff@0.14 format --no-cache --check
