on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

env:
  TFTP_SERVER: "ecovault.oryx-coho.ts.net"
  TFTP_USER: "auto"
  KEEP_RUNS: 7

jobs:
  tftp-janitor:
    runs-on: docker
    container:
      image: debian:trixie-slim
    steps:
      - name: set up SSH
        run: |
          apt-get update -qq && apt-get install -y -qq openssh-client rsync
          mkdir -p ~/.ssh
          echo "${{ secrets.TFTP_SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_rsa

      - name: clean up old artifacts
        env:
          BOARDS: "bananapi-f3 eswin-ebc77 muse-pi-pro nezha-allwinner-d1 orangepi-rv2"
        run: |
          for BOARD in ${BOARDS}; do
            echo "=== Cleaning ${BOARD} ==="
            ssh -i ~/.ssh/id_rsa ${TFTP_USER}@${TFTP_SERVER} BOARD="${BOARD}" KEEP_RUNS="${KEEP_RUNS}" bash << 'EOF'
              set -e
              BOARD_DIR="/srv/tftp/${BOARD}"
              if [ ! -d "${BOARD_DIR}" ]; then
                echo "No directory for ${BOARD}, skipping"
                exit 0
              fi
              cd "${BOARD_DIR}"

              # Clean wic.gz files
              WIC_FILES=$(ls -1t core-image-full-cmdline-${BOARD}.rootfs-????????[0-9][0-9][0-9][0-9][0-9][0-9].wic.gz 2>/dev/null)
              TOTAL=$(echo "${WIC_FILES}" | grep -c . || true)
              if [ "${TOTAL}" -gt "${KEEP_RUNS}" ]; then
                echo "${WIC_FILES}" | tail -n +$((KEEP_RUNS + 1)) | xargs rm -v
              fi

              # Clean matching bmap files
              BMAP_FILES=$(ls -1t core-image-full-cmdline-${BOARD}.rootfs-????????[0-9][0-9][0-9][0-9][0-9][0-9].wic.bmap 2>/dev/null)
              TOTAL=$(echo "${BMAP_FILES}" | grep -c . || true)
              if [ "${TOTAL}" -gt "${KEEP_RUNS}" ]; then
                echo "${BMAP_FILES}" | tail -n +$((KEEP_RUNS + 1)) | xargs rm -v
              fi

              echo "Done cleaning ${BOARD}"
EOF
          done

