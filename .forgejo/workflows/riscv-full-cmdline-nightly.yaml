on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      machines:
        description: 'Machines to run against'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - bananapi-f3
          - eswin-ebc77-mainline
          - muse-pi-pro
          - nezha-allwinner-d1
          - orangepi-rv2-mainline
      bitbake_setup_override:
        description: 'bitbake-setup source override to apply (none for default)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - meta-riscv-tgamblin-k1-fixes
env:
  FORGEJO_URL: "https://forgejo.oryx-coho.ts.net"
  TFTP_SERVER: "ecovault.oryx-coho.ts.net"
  TFTP_USER: "auto"

jobs:
  build-riscv-image:
    runs-on: docker
    strategy:
      matrix:
        machine: >-
          ${{
            inputs.machines == 'all' && fromJSON('["bananapi-f3", "eswin-ebc77-mainline", "muse-pi-pro", "nezha-allwinner-d1", "orangepi-rv2-mainline"]') ||
            inputs.machines != 'all' && inputs.machines != '' && fromJSON(format('["{0}"]', inputs.machines)) ||
            fromJSON('["bananapi-f3", "eswin-ebc77-mainline", "muse-pi-pro", "nezha-allwinner-d1", "orangepi-rv2-mainline"]')
          }}
    container:
      image: tgamblin/yocto-builder
      volumes:
        - /auto/runner/buildcache:/buildcache
      env:
        DL_DIR: "/buildcache/downloads"
        SSTATE_DIR: "/buildcache/sstate-cache"
        BITBAKE_SETUP_OVERRIDE: ${{ inputs.bitbake_setup_override || 'none' }}
        RISCV_MACHINE: ${{ matrix.machine }}
        YOCTO_IMAGES_PATH: ${{ github.workspace }}/bitbake-builds/oe-nodistro-master-meta-riscv/build/tmp/deploy/images
    steps:
      - name: set up bitbake, workflows
        run: |
          locale-gen en_US.UTF-8
          export LANG=en_US.UTF-8
          git clone https://forgejo.oryx-coho.ts.net/tgamblin/boardgarden.git
          git clone https://forgejo.oryx-coho.ts.net/tgamblin/bitbake.git

      - name: configure bitbake and layers
        run: |
          OVERRIDE_ARG=""
          if [ "${BITBAKE_SETUP_OVERRIDE}" != "none" ]; then
            OVERRIDE_ARG="--source-override boardgarden/.forgejo/bitbake-configs/${BITBAKE_SETUP_OVERRIDE}-override.json"
          fi

          ./bitbake/bin/bitbake-setup \
            --debug \
            init \
            --non-interactive \
            ${OVERRIDE_ARG} \
            boardgarden/.forgejo/bitbake-configs/meta-riscv-oe-nodistro-master.conf.json \
            nodistro \
            machine/${{ matrix.machine }}

      - name: build core-image-full-cmdline
        run: |
          . "$GITHUB_WORKSPACE"/bitbake-builds/oe-nodistro-master-meta-riscv/build/init-build-env

          bitbake-config-build \
          enable-fragment \
          core/yocto/root-login-with-empty-password

          # We need to disable osc-context for systemd to avoid issues with
          # labgrid detecting prompts when images are booted
          echo "PACKAGECONFIG:remove:pn-systemd = \"osc-context\"" >> conf/local.conf

          bitbake core-image-full-cmdline

      - name: copy kernel and dtb to TFTP server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TFTP_SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_rsa
          BOARD="${RISCV_MACHINE%-mainline}"
          rsync -avz --omit-link-times --ignore-missing-args ${YOCTO_IMAGES_PATH}/${RISCV_MACHINE}/Image* ${TFTP_USER}@${TFTP_SERVER}:/srv/tftp/${BOARD}/
          rsync -avz --omit-link-times --ignore-missing-args ${YOCTO_IMAGES_PATH}/${RISCV_MACHINE}/*.dtb ${TFTP_USER}@${TFTP_SERVER}:/srv/tftp/${BOARD}/
          rsync -avz --omit-link-times --ignore-missing-args ${YOCTO_IMAGES_PATH}/${RISCV_MACHINE}/extlinux.conf ${TFTP_USER}@${TFTP_SERVER}:/srv/tftp/${BOARD}/

      - name: copy image wic files to TFTP server
        if: matrix.machine == 'bananapi-f3'
        run: |
          BOARD="${RISCV_MACHINE%-mainline}"
          rsync -avz --omit-link-times --ignore-missing-args ${YOCTO_IMAGES_PATH}/${RISCV_MACHINE}/core-image-full-cmdline-${RISCV_MACHINE}.rootfs-*.wic.gz ${TFTP_USER}@${TFTP_SERVER}:/srv/tftp/${BOARD}/
          rsync -avz --omit-link-times --ignore-missing-args ${YOCTO_IMAGES_PATH}/${RISCV_MACHINE}/core-image-full-cmdline-${RISCV_MACHINE}.rootfs-*.wic.bmap ${TFTP_USER}@${TFTP_SERVER}:/srv/tftp/${BOARD}/

          ssh ${TFTP_USER}@${TFTP_SERVER} "
            cd /srv/tftp/${BOARD} &&
            ln -sf \$(ls -1t core-image-full-cmdline-${BOARD}.rootfs-*.wic.gz  | head -1) core-image-full-cmdline-${BOARD}.rootfs-latest.wic.gz &&
            ln -sf \$(ls -1t core-image-full-cmdline-${BOARD}.rootfs-*.wic.bmap | head -1) core-image-full-cmdline-${BOARD}.rootfs-latest.wic.bmap
          "
      - name: trigger board tests
        if: success()
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.ACTION_DISPATCH }}" \
            -H "Content-Type: application/json" \
            "${{ env.FORGEJO_URL }}/api/v1/repos/${{ github.repository }}/dispatches" \
            --data '{
              "event_type": "run-board-tests",
              "client_payload": {
                "machine": "${{ matrix.machine }}",
                "sha": "${{ github.sha }}"
              }
            }'
