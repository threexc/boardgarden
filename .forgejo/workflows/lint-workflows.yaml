name: Lint workflows

on:
  push:
    paths:
      - '.forgejo/workflows/**'
  pull_request:
    paths:
      - '.forgejo/workflows/**'

jobs:
  lint:
    runs-on: tgamblin-maintenance
    steps:
      - uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Run zizmor
        # --no-online-audits: this runner has no GitHub API token, and online
        # audits (e.g. ref-confusion) fail with 401s against the real GitHub
        # API rather than degrading gracefully.
        run: uvx zizmor --no-online-audits .forgejo/workflows/nightly-build-and-test.yaml .forgejo/workflows/weekly-build-only.yaml .forgejo/workflows/meta-riscv-check-layer.yaml .forgejo/workflows/riscv-ptest-nightly.yaml
