[build-system]
requires = ["uv_build>=0.5,<0.12"]
build-backend = "uv_build"

[project]
name = "boardfarm-common"
version = "0.1.0"
description = "Shared helpers and fixtures for boardfarm pytest suites"
requires-python = ">=3.11"
dependencies = [
    "ansicolors",
    "jinja2",
    "jsonschema",
    "labgrid",
    "pytest",
    "pytest-html",
    "pyyaml",
    "usbsdmux",
]

[project.scripts]
boardfarm-validate = "boardfarm_common.validate:main"
boardfarm-render = "boardfarm_common.render:main"

# Auto-loaded into any pytest run inside this venv:
[project.entry-points.pytest11]
boardfarm_common = "boardfarm_common.fixtures"

# Strategy family registry. Add a line here to expose a new family; third-party
# packages register in the same group.
[project.entry-points."boardfarm.strategies"]
tftp = "boardfarm_common.strategies.tftp:TftpBootStrategy"
sdmux = "boardfarm_common.strategies.sdmux:SdMuxBootStrategy"
qemu = "boardfarm_common.strategies.qemu:QemuBootStrategy"
