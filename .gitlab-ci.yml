stages:
  - build
  - test

variables:
  REGISTRY: forgejo.oryx-coho.ts.net
  YOCTO_BUILDER_IMAGE: forgejo.oryx-coho.ts.net/tgamblin/yocto-builder:latest
  LG_OPERATOR_IMAGE: forgejo.oryx-coho.ts.net/tgamblin/lg-operator:latest
  CONTAINER_BUILDER_IMAGE: forgejo.oryx-coho.ts.net/tgamblin/container-builder:latest
  BOARDGARDEN_URL: https://forgejo.oryx-coho.ts.net/tgamblin/boardgarden.git
  BITBAKE_URL: https://forgejo.oryx-coho.ts.net/tgamblin/bitbake.git
  OE_CORE_URL: https://forgejo.oryx-coho.ts.net/tgamblin/openembedded-core.git
  META_RISCV_URL: https://forgejo.oryx-coho.ts.net/tgamblin/meta-riscv.git
  FORGEJO_URL: https://forgejo.oryx-coho.ts.net
  TFTP_SERVER: ecovault.oryx-coho.ts.net
  TFTP_USER: auto
  ECOGRID_IP: 192.168.40.101
  ECOVAULT_IP: 192.168.40.134
  # Schedule name — set this variable in each GitLab pipeline schedule:
  #   build-containers | check-layer | ptest-nightly | yocto-image-nightly | board-test-nightly
  SCHEDULE_NAME: ""

include:
  - local: .gitlab/templates/ssh.yml
  - local: .gitlab/templates/tftp.yml
  - local: .gitlab/templates/dispatch.yml
  - local: .gitlab/pipelines/build-containers.yml
  - local: .gitlab/pipelines/check-layer.yml
  - local: .gitlab/pipelines/ptest-nightly.yml
  - local: .gitlab/pipelines/yocto-image-nightly.yml
  - local: .gitlab/pipelines/board-test-nightly.yml
