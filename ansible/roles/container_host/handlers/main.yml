---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart testresults-nginx
  ansible.builtin.systemd:
    name: testresults-nginx.service
    state: restarted

- name: Restart tftpd-hpa
  ansible.builtin.systemd:
    name: tftpd-hpa.service
    state: restarted
