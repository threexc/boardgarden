---
# Existing bare-metal user that already owns the report tree and holds
# REPORT_SSH_KEY. The container runs as this UID/GID so file ownership on
# /testresults doesn't change.
container_host_testresults_reporter_user: reporter

container_host_testresults_path: /testresults
container_host_testresults_nginx_conf_dir: /etc/testresults-nginx
container_host_testresults_nginx_image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
# Host-side published port; the container always listens on 8080 internally
# (the nginx-unprivileged image's default, unrelated to this value).
container_host_testresults_nginx_port: 8080

# Existing bare-metal user/directory the tftpd-hpa package already created
# during the ecovault -> ecogrid migration.
container_host_tftp_user: tftp
container_host_tftp_root: /srv/tftp
container_host_tftpd_hpa_image_tag: localhost/boardgarden-tftpd-hpa:latest
container_host_tftpd_hpa_build_dir: /etc/tftpd-hpa-build
