[project]
name = "boardfarm"
version = "0.1.0"
description = "tgamblin's board farm test suites"
requires-python = ">=3.11"
dependencies = [
    "boardfarm-common",
]

[build-system]
requires = ["uv_build>=0.5,<0.12"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["common"]

[tool.uv.sources]
boardfarm-common = { workspace = true }

# Tell pytest where to look and set a sensible rootdir.
[tool.pytest.ini_options]
testpaths = [
    "common/src/boardfarm_common/tests",
    "boards/bananapi-f3/pytest",
    "boards/qemuriscv64/pytest",
]
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

[dependency-groups]
dev = [
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "**/pytest/**/conftest.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
]
ignore = [
    "E501", # line too long — formatter handles
]

[tool.ruff.lint.per-file-ignores]
"**/strategy.py" = ["F401"]  # subclass files re-export attrs/labgrid decorators indirectly
